<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>UPOP — Заявки</title>
<link rel="icon" href="/logo-nav.webp" type="image/webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
<!-- reuse the website's own design system (tokens, buttons, fonts, colours) -->
<link rel="stylesheet" href="/css/styles.css" />
<style>
  body{ background:var(--bg); min-height:100vh; transition:background .3s ease;
    --st-green:#3fbf6f; --st-yellow:#e6b93e; --st-red:#e56464; }
  a{ color:inherit; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 clamp(16px,4vw,40px); }
  .u{ font-family:var(--font-disp); letter-spacing:-.02em; }

  /* ---------- top bar ---------- */
  .abar{ position:sticky; top:0; z-index:20; background:rgba(5,12,17,.82);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line-gold); }
  .abar__in{ display:flex; align-items:center; gap:12px; padding:14px 0; }
  .abar__brand{ display:flex; align-items:center; gap:11px; font-family:var(--font-disp); font-weight:700; font-size:1.1rem; letter-spacing:-.02em; }
  .abar__brand img{ height:30px; width:auto; display:block; }
  .abar__sp{ flex:1; }
  .cnt{ font-size:.9rem; color:var(--ink-70); white-space:nowrap; }
  .cnt b{ color:var(--gold-hi); font-family:var(--font-disp); font-weight:600; }
  .iconbtn,.tgl{ appearance:none; border:1px solid var(--line-gold); background:var(--surface); color:var(--ink);
    border-radius:11px; padding:0; width:42px; height:42px; display:inline-grid; place-items:center; cursor:pointer; transition:.16s; }
  .iconbtn:hover,.tgl:hover{ border-color:var(--gold); background:var(--surface-2); }
  .iconbtn svg,.tgl svg{ width:18px; height:18px; display:block; }
  .tgl{ font:inherit; font-weight:700; font-size:.84rem; font-family:var(--font-disp); }
  .ghost{ appearance:none; border:1px solid var(--line-gold); background:var(--surface); color:var(--ink);
    border-radius:11px; padding:0 16px; height:42px; font:inherit; font-size:.86rem; font-weight:700; cursor:pointer; transition:.16s;
    font-family:var(--font-disp); letter-spacing:-.01em; }
  .ghost:hover{ border-color:var(--gold); background:var(--surface-2); }

  /* ---------- tools / filters ---------- */
  .tools{ display:flex; flex-wrap:wrap; gap:12px; padding:24px 0 6px; align-items:center; }
  .srch{ position:relative; flex:1 1 280px; min-width:190px; }
  .srch svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.5; pointer-events:none; }
  .srch input{ width:100%; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-input); padding:13px 15px 13px 42px; transition:.2s; }
  .srch input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }

  .segf{ display:flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:5px; overflow-x:auto; scrollbar-width:none; max-width:100%; }
  .segf::-webkit-scrollbar{ display:none; }
  .segf__b{ appearance:none; border:0; background:transparent; color:var(--ink-70); cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:10px; transition:.16s;
    font-family:var(--font-disp); font-weight:600; font-size:.82rem; letter-spacing:-.01em; }
  .segf__b:hover{ color:var(--ink); background:var(--surface-2); }
  .segf__b.is-on{ color:var(--ink); background:var(--surface-2); box-shadow:inset 0 0 0 1.5px var(--line-gold); }
  .segf__dot{ width:11px; height:11px; border-radius:50%; flex:0 0 auto; }
  .segf__dot--green{ background:var(--st-green); } .segf__dot--yellow{ background:var(--st-yellow); } .segf__dot--red{ background:var(--st-red); }
  .segf__b.is-on .segf__dot{ box-shadow:0 0 0 3px color-mix(in srgb, currentColor 0%, var(--st-green) 26%); }

  .sel{ position:relative; }
  .sel select{ font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:13px 40px 13px 15px; appearance:none; font-weight:700; cursor:pointer; max-width:220px;
    font-family:var(--font-disp); font-size:.84rem; letter-spacing:-.01em; }
  .sel select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }
  .sel::after{ content:""; position:absolute; right:16px; top:50%; width:7px; height:7px; pointer-events:none;
    border-right:2px solid var(--ink-70); border-bottom:2px solid var(--ink-70); transform:translateY(-70%) rotate(45deg); }

  /* ---------- cards ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr)); gap:22px; padding:22px 0 90px; align-items:stretch; }
  .acard{ position:relative; display:flex; flex-direction:column; height:100%;
    background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:24px 26px;
    box-shadow:0 20px 50px -32px rgba(0,0,0,.85);
    transition:border-color .2s, transform .18s var(--e-quint), box-shadow .2s; animation:acIn .5s var(--e-quint) both; }
  @keyframes acIn{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
  .grid.no-anim .acard{ animation:none; }
  .acard:hover{ border-color:var(--line-gold); transform:translateY(-3px); box-shadow:0 30px 64px -34px rgba(0,0,0,.95); }
  .acard[data-status="green"]{ border-color:color-mix(in srgb, var(--st-green) 55%, var(--line)); }
  .acard[data-status="yellow"]{ border-color:color-mix(in srgb, var(--st-yellow) 55%, var(--line)); }
  .acard[data-status="red"]{ border-color:color-mix(in srgb, var(--st-red) 55%, var(--line)); }

  .ac__top{ display:flex; justify-content:space-between; gap:14px; align-items:flex-start; margin-bottom:12px; }
  .ac__name{ font-family:var(--font-disp); font-weight:700; font-size:1.42rem; line-height:1.2; letter-spacing:-.02em;
    margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ac__end{ display:flex; flex-direction:column; align-items:flex-end; gap:9px; flex:0 0 auto; }
  .ac__date{ font-size:.82rem; color:var(--ink-50); white-space:nowrap; }
  .ac__dot{ width:15px; height:15px; border-radius:50%; border:2px solid var(--line); background:transparent; }
  .acard[data-status="green"] .ac__dot{ background:var(--st-green); border-color:var(--st-green); box-shadow:0 0 0 4px rgba(63,191,111,.2); }
  .acard[data-status="yellow"] .ac__dot{ background:var(--st-yellow); border-color:var(--st-yellow); box-shadow:0 0 0 4px rgba(230,185,62,.2); }
  .acard[data-status="red"] .ac__dot{ background:var(--st-red); border-color:var(--st-red); box-shadow:0 0 0 4px rgba(229,100,100,.2); }

  .meta{ display:flex; flex-wrap:wrap; align-items:baseline; margin-bottom:16px; color:var(--ink-70); font-size:.98rem;
    font-family:var(--font-disp); font-weight:500; letter-spacing:-.01em; }
  .meta span{ color:var(--ink); }
  .meta span + span::before{ content:"·"; color:var(--ink-34); margin:0 10px; }

  /* stacked label→value: every value starts at the same edge, so the column
     reads perfectly even regardless of label length */
  .kvline{ margin:13px 0; }
  .kvline .k{ display:block; color:var(--ink-50); font-size:.68rem; font-family:var(--font-disp); font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; margin-bottom:4px; }
  .kvline .v{ color:var(--ink); font-weight:600; font-size:1.04rem; line-height:1.42; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .kvline .v a{ color:var(--gold-hi); text-decoration:none; }
  .kvline .v a:hover{ text-decoration:underline; }

  /* history preview on the card */
  .ac__hist{ margin:16px 0 2px; padding:14px 16px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; }
  .ac__hist-h{ margin:0 0 6px; font-family:var(--font-disp); font-weight:600; font-size:.7rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--gold); }
  .ac__hist-t{ margin:0; color:var(--ink); font-size:1rem; line-height:1.58; white-space:pre-wrap; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }

  .ac__foot{ display:flex; align-items:center; gap:12px; margin-top:auto; padding-top:16px; border-top:1px solid var(--line); }
  .rvbtn{ appearance:none; font:inherit; font-family:var(--font-disp); font-weight:600; letter-spacing:-.01em; font-size:.88rem;
    display:inline-flex; align-items:center; gap:9px; padding:11px 16px; border-radius:12px; cursor:pointer;
    color:var(--ink); background:var(--surface-2); border:1px solid var(--line-gold); transition:.16s; }
  .rvbtn:hover{ border-color:var(--gold); background:var(--surface); transform:translateY(-1px); }
  .rvbtn:active{ transform:translateY(0); }
  .rvbtn svg{ width:16px; height:16px; }
  .expand{ margin-left:auto; font-size:.9rem; font-weight:600; color:var(--ink-70); cursor:pointer; background:none; border:0;
    font-family:var(--font-disp); letter-spacing:-.01em; white-space:nowrap; padding:6px 2px; }
  .expand:hover{ color:var(--gold-hi); }

  .det{ margin-top:16px; }
  .det .g{ margin-top:14px; }
  .det .g h4{ margin:0 0 8px; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--gold);
    font-weight:600; font-family:var(--font-disp); }
  .det dl{ display:grid; grid-template-columns:150px 1fr; gap:8px 14px; font-size:1rem; margin:0; }
  .det dt{ color:var(--ink-50); font-family:var(--font-disp); font-weight:500; font-size:.9rem; letter-spacing:-.01em; }
  .det dd{ margin:0; color:var(--ink); word-break:break-word; }
  .yes{ color:#2e9b63; font-weight:700; } .no{ color:var(--ink-50); }

  /* ---------- review dialog ---------- */
  .rev{ border:0; padding:0; background:transparent; width:min(94vw,640px); max-height:calc(100dvh - 40px); color:var(--ink); overflow:visible; }
  .rev::backdrop{ background:rgba(3,8,12,.66); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .rev[open]{ animation:revIn .28s var(--e-quint) both; }
  @keyframes revIn{ from{ opacity:0; transform:translateY(14px) scale(.985); } to{ opacity:1; transform:none; } }
  .rev__card{ background:linear-gradient(180deg,var(--surface),var(--bg-2)); border:1px solid var(--line-gold);
    border-radius:22px; padding:24px 24px 20px; box-shadow:0 44px 110px -46px rgba(0,0,0,.92);
    display:flex; flex-direction:column; gap:15px; max-height:calc(100dvh - 40px); }
  .rev__head{ display:flex; align-items:flex-start; gap:14px; }
  .rev__name{ margin:0; font-family:var(--font-disp); font-weight:700; font-size:1.4rem; letter-spacing:-.02em; line-height:1.16; }
  .rev__sub{ margin:4px 0 0; color:var(--ink-50); font-size:.9rem; font-weight:600; }
  .rev__x{ margin-left:auto; flex:0 0 auto; width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
    border:1px solid var(--line); background:transparent; color:var(--ink-70); cursor:pointer; transition:.16s; }
  .rev__x:hover{ border-color:var(--gold); color:var(--ink); background:var(--surface); }
  .rev__x svg{ width:17px; height:17px; }
  .rev__label{ font-family:var(--font-disp); font-weight:600; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
  .rev__ta{ width:100%; min-height:230px; max-height:48vh; resize:vertical; font:inherit; font-size:1.04rem; line-height:1.62;
    color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:15px 16px; transition:.18s; }
  .rev__ta::placeholder{ color:var(--ink-34); }
  .rev__ta:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }
  .rev__colors{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .swatches{ display:flex; gap:10px; }
  .sw{ width:40px; height:40px; border-radius:50%; cursor:pointer; border:2px solid; background:transparent; transition:.16s;
    display:grid; place-items:center; color:#08130f; -webkit-tap-highlight-color:transparent; }
  .sw svg{ width:19px; height:19px; opacity:0; transform:scale(.5); transition:.16s; }
  .sw.is-on svg{ opacity:1; transform:scale(1); }
  .sw:hover{ transform:scale(1.08); } .sw:active{ transform:scale(.94); }
  .sw--green{ border-color:var(--st-green); } .sw--green.is-on{ background:var(--st-green); }
  .sw--yellow{ border-color:var(--st-yellow); } .sw--yellow.is-on{ background:var(--st-yellow); }
  .sw--red{ border-color:var(--st-red); } .sw--red.is-on{ background:var(--st-red); }
  .sw--clear{ border-color:var(--line-gold); color:var(--ink-70); font-size:1.2rem; line-height:1; }
  .sw--clear.is-on{ background:var(--surface-2); box-shadow:inset 0 0 0 1.5px var(--gold); color:var(--ink); }
  .sw--clear::before{ content:"—"; }
  .rev__actions{ display:flex; gap:10px; margin-top:2px; }
  .rev__actions .btn{ flex:0 0 auto; }
  .rev__save{ min-width:150px; }
  .rev__err{ color:#e0466f; min-height:1em; font-size:.88rem; }

  /* ---------- states / login ---------- */
  .state{ text-align:center; padding:80px 20px; color:var(--ink-70); }
  .state h3{ font-family:var(--font-disp); color:var(--ink); margin:0 0 8px; letter-spacing:-.02em; }
  .spin{ width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--gold);
    border-radius:50%; margin:0 auto 18px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .login{ min-height:100vh; display:grid; place-items:center; padding:24px; position:relative; }
  .login__tgl{ position:absolute; top:18px; right:18px; display:flex; gap:8px; }
  .login__card{ width:100%; max-width:390px; background:linear-gradient(180deg,var(--surface),var(--bg-2));
    border:1px solid var(--line-gold); border-radius:var(--r-card); padding:34px 28px; text-align:center;
    box-shadow:0 26px 60px -30px rgba(0,0,0,.85); animation:acIn .5s var(--e-quint) both; }
  .login__card img{ height:54px; margin:0 auto 16px; display:block; }
  .login__card h1{ font-family:var(--font-disp); font-weight:700; font-size:1.35rem; margin:0 0 6px; letter-spacing:-.02em; }
  .login__card p{ color:var(--ink-70); font-size:.9rem; margin:0 0 22px; }
  .login__card input{ width:100%; padding:14px 16px; font:inherit; color:var(--ink); text-align:center; letter-spacing:.05em;
    background:var(--bg); border:1px solid var(--line); border-radius:var(--r-input); margin-bottom:14px; }
  .login__card input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }
  .err{ color:#e0466f; font-size:.86rem; margin-top:12px; min-height:1em; }

  ::selection{ background:var(--gold); color:#0a0a0a; }
  [hidden]{ display:none!important; }

  /* ================= LIGHT MODE ================= */
  html.light{
    --bg:#F4EFE3; --bg-2:#EBE3D3; --surface:#FFFFFF; --surface-2:#F7F1E6;
    --ink:#241A0C; --ink-70:rgba(36,26,12,.72); --ink-50:rgba(36,26,12,.52); --ink-34:rgba(36,26,12,.32);
    --line:rgba(36,26,12,.12); --line-gold:rgba(150,110,40,.42);
  }
  html.light body{ background:var(--bg); }
  html.light .abar{ background:rgba(255,255,255,.86); }
  html.light .hl{ background:none; -webkit-text-fill-color:#8A5F1C; color:#8A5F1C; animation:none; }
  html.light .sel select option{ background:#fff; color:var(--ink); }
  html.light .acard{ box-shadow:0 16px 40px -30px rgba(60,40,10,.35); }
  html.light .acard:hover{ box-shadow:0 26px 54px -32px rgba(60,40,10,.4); }
  html.light .login__card,html.light .rev__card{ box-shadow:0 30px 70px -40px rgba(60,40,10,.4); }
  html.light .kvline .v a{ color:#946a16; }
  html.light .cnt b,html.light .det .g h4,html.light .ac__hist-h,html.light .rev__label{ color:#8A5F1C; }
  html.light .rev::backdrop{ background:rgba(60,45,20,.4); }

  /* ================= RESPONSIVE ================= */
  @media (max-width:640px){
    .abar__in{ flex-wrap:wrap; gap:9px 10px; padding:12px 0; }
    .abar__brand span{ display:none; }
    .abar__brand img{ height:32px; }
    .cnt{ order:5; flex-basis:100%; }
    .iconbtn,.tgl,.ghost{ height:40px; } .iconbtn,.tgl{ width:40px; }
    .ghost{ padding:0 13px; font-size:.82rem; }
    .tools{ gap:10px; padding:16px 0 2px; }
    .srch{ flex-basis:100%; } .segf{ flex-basis:100%; } .sel{ flex:1 1 100%; } .sel select{ max-width:none; width:100%; }
    .grid{ gap:14px; padding:16px 0 70px; }
    .acard{ padding:20px 19px; border-radius:16px; }
    .ac__name{ font-size:1.28rem; }
    .kvline{ margin:11px 0; }
    .det dl{ grid-template-columns:1fr; gap:2px 0; font-size:.95rem; }
    .det dt{ margin-top:8px; }
    .rev__card{ padding:20px 18px 16px; border-radius:18px; }
    .rev__ta{ min-height:200px; }
    .rev__actions{ flex-wrap:wrap; } .rev__actions .btn,.rev__actions .ghost{ flex:1 1 100%; }
  }
  @media (max-width:380px){
    .ac__name{ font-size:1.16rem; }
    .kvline .k{ flex-basis:80px; }
    .acard{ padding:17px 15px; }
  }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<section class="login" id="login">
  <div class="login__tgl">
    <button class="tgl" id="langBtn2">UZ</button>
    <button class="tgl" id="themeBtn2" aria-label="Theme"></button>
  </div>
  <div class="login__card">
    <img src="/logo-hero.png" alt="U POP TREND" />
    <h1 class="hl" id="l_title">Заявки</h1>
    <p id="l_sub">Введите пароль администратора</p>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" required />
      <button class="btn btn--pop btn--block" type="submit" id="loginBtn"><span class="btn__label" id="l_enter">Войти</span></button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</section>

<!-- ===== APP ===== -->
<div id="app" hidden>
  <header class="abar">
    <div class="wrap abar__in">
      <a class="abar__brand" href="/"><img src="/logo-hero.png" alt="" /> <span class="hl" id="a_title">Заявки</span></a>
      <div class="abar__sp"></div>
      <span class="cnt" id="count"></span>
      <button class="tgl" id="langBtn">UZ</button>
      <button class="tgl" id="themeBtn" aria-label="Theme"></button>
      <button class="iconbtn" id="refresh" aria-label="Refresh"></button>
      <button class="ghost" id="logout">Выйти</button>
    </div>
  </header>

  <div class="wrap">
    <div class="tools">
      <label class="srch">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" autocomplete="off" />
      </label>
      <div class="segf" id="fStatus" role="group" aria-label="Filter by status">
        <button class="segf__b is-on" data-v=""><span class="segf__t">Все</span></button>
        <button class="segf__b" data-v="no"><span class="segf__t">Не рассм.</span></button>
        <button class="segf__b" data-v="any"><span class="segf__t">Рассм.</span></button>
        <button class="segf__b" data-v="green"><i class="segf__dot segf__dot--green"></i><span class="segf__t">Зелёные</span></button>
        <button class="segf__b" data-v="yellow"><i class="segf__dot segf__dot--yellow"></i><span class="segf__t">Жёлтые</span></button>
        <button class="segf__b" data-v="red"><i class="segf__dot segf__dot--red"></i><span class="segf__t">Красные</span></button>
      </div>
      <div class="sel"><select id="fGenre"></select></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- ===== REVIEW DIALOG (history + colour, saved in one write) ===== -->
<dialog class="rev" id="rev" aria-labelledby="revName">
  <div class="rev__card">
    <div class="rev__head">
      <div>
        <h2 class="rev__name" id="revName"></h2>
        <p class="rev__sub" id="revSub"></p>
      </div>
      <button class="rev__x" id="revX" type="button" aria-label="Close"></button>
    </div>
    <label class="rev__label" id="revHistLabel" for="revTa">История участника</label>
    <textarea class="rev__ta" id="revTa"></textarea>
    <div class="rev__colors">
      <span class="rev__label" id="revRateLabel">Оценка</span>
      <div class="swatches" id="revSwatches">
        <button class="sw sw--clear" data-s="" type="button" aria-label="No rating"></button>
        <button class="sw sw--green" data-s="green" type="button" aria-label="Green"></button>
        <button class="sw sw--yellow" data-s="yellow" type="button" aria-label="Yellow"></button>
        <button class="sw sw--red" data-s="red" type="button" aria-label="Red"></button>
      </div>
    </div>
    <div class="rev__actions">
      <button class="btn btn--pop rev__save" id="revSave" type="button"><span class="btn__label rvlbl">Сохранить</span></button>
      <button class="ghost" id="revCancel" type="button">Отмена</button>
    </div>
    <div class="rev__err" id="revErr"></div>
  </div>
</dialog>

<script>
  var ENDPOINT = "https://script.google.com/macros/s/AKfycby7z5nB-DfFxk6tBGVCFkMQNpPCdNbHI9DSURAMYiUt8GKPasqRNULcyG-A3lZzZzEIwQ/exec";
  var KEY_STORE="upop_admin_key", LANG_STORE="upop_admin_lang", THEME_STORE="upop_admin_theme";
  var state = { rows: [], key: "", fStatus: "" };
  var rev = { id:null, status:"" };
  var lang, theme;
  try{ lang = localStorage.getItem(LANG_STORE)||"ru"; }catch(e){ lang="ru"; }
  try{ theme = localStorage.getItem(THEME_STORE)||"dark"; }catch(e){ theme="dark"; }

  /* drawn icons — no emoji-as-icon */
  var ICN = {
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>',
    refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>',
    close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
    note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'
  };

  var GROUPS = [
    { id:"contacts", keys:["phone","email","citizenship"] },
    { id:"parent",   keys:["parent_name","parent_relation","parent_phone","parent_email","parent_consent"] },
    { id:"creative", keys:["piece","genre","education","instruments","years_singing","vocal_teacher","contests","video","rule_agree"] },
    { id:"about",    keys:["why","music_means","three_words","idol","hobbies","free_time"] },
    { id:"family",   keys:["father_name","father_job","mother_name","mother_job","siblings","live_with","support"] },
    { id:"health",   keys:["chronic","allergy","emergency_contact"] },
    { id:"consents", keys:["log_attend","log_stages","log_travel","consent_data","consent_media","consent_rules","consent_true","lang","submissionId"] }
  ];

  var T = {
    ru:{
      title:"Заявки", sub:"Введите пароль администратора", pw:"Пароль", enter:"Войти",
      wrongpw:"Неверный пароль", needscript:"Обновите скрипт таблицы (команда list не найдена)",
      logout:"Выйти", search:"Поиск: имя, телефон, город, произведение, история…",
      seg_all:"Все", seg_no:"Не рассм.", seg_any:"Рассм.", seg_green:"Зелёные", seg_yellow:"Жёлтые", seg_red:"Красные",
      f_genre:"Жанр: все", loading:"Загрузка…", refreshing:"Обновляю…",
      empty_h:"Пока нет заявок", empty_p:"Как только кто-то отправит анкету — она появится здесь.",
      none_h:"Ничего не найдено", none_p:"Измените поиск или фильтр.",
      review:"История и оценка", more:"Подробнее", less:"Свернуть", years:"лет", socials:"Соцсети",
      male:"Мужской", female:"Женский", yes:"✓ Да", no:"— Нет",
      hist_h:"История участника", hist_ph:"Заметки, наблюдения, впечатления о выступлении — можно длинно.",
      rate:"Оценка", save:"Сохранить", saving:"Сохраняю…", cancel:"Отмена",
      savefail:"Не удалось сохранить. Попробуйте ещё раз.",
      count:function(n,d,tt){ return "Показано <b>"+n+"</b> · рассмотрено <b>"+d+"</b> из "+tt; },
      L:{ citizenship:"Гражданство", email:"E-mail", phone:"Телефон",
        parent_name:"Родитель/представитель", parent_relation:"Кем приходится", parent_phone:"Телефон родителя",
        parent_email:"E-mail родителя", parent_consent:"Согласие родителя",
        rule_agree:"Согласен с правилами", piece:"Произведение", genre:"Жанр", education:"Муз. образование",
        instruments:"Инструменты", years_singing:"Стаж пения", vocal_teacher:"Педагог", contests:"Конкурсы/шоу", video:"Видео",
        why:"Почему участвует", music_means:"Что для него музыка", three_words:"Три слова о себе",
        idol:"Кумир", hobbies:"Увлечения", free_time:"Свободное время",
        father_name:"Отец", father_job:"Работа отца", mother_name:"Мать", mother_job:"Работа матери",
        siblings:"Братья/сёстры", live_with:"С кем живёт", support:"Кто поддерживает",
        chronic:"Хрон. болезни", allergy:"Аллергия", emergency_contact:"Экстренный контакт",
        log_attend:"Придёт лично", log_stages:"Готов к этапам", log_travel:"Готов к поездкам",
        consent_data:"Согл.: данные", consent_media:"Согл.: медиа", consent_rules:"Согл.: правила",
        consent_true:"Данные верны", lang:"Язык", submissionId:"ID" },
      G:{ contacts:"Контакты", parent:"Родитель", creative:"Творчество", about:"О себе", family:"Семья", health:"Здоровье", consents:"Логистика и согласия" }
    },
    uz:{
      title:"Arizalar", sub:"Administrator parolini kiriting", pw:"Parol", enter:"Kirish",
      wrongpw:"Parol noto‘g‘ri", needscript:"Jadval skriptini yangilang (list buyrug‘i topilmadi)",
      logout:"Chiqish", search:"Qidiruv: ism, telefon, shahar, asar, tarix…",
      seg_all:"Barchasi", seg_no:"Ko‘rilmagan", seg_any:"Ko‘rilgan", seg_green:"Yashil", seg_yellow:"Sariq", seg_red:"Qizil",
      f_genre:"Janr: barchasi", loading:"Yuklanmoqda…", refreshing:"Yangilanmoqda…",
      empty_h:"Hozircha arizalar yo‘q", empty_p:"Kimdir anketa yuborishi bilan u shu yerda paydo bo‘ladi.",
      none_h:"Hech narsa topilmadi", none_p:"Qidiruv yoki filtrni o‘zgartiring.",
      review:"Tarix va baho", more:"Batafsil", less:"Yig‘ish", years:"yosh", socials:"Ijtimoiy tarmoqlar",
      male:"Erkak", female:"Ayol", yes:"✓ Ha", no:"— Yo‘q",
      hist_h:"Ishtirokchi tarixi", hist_ph:"Ishtirokchi haqidagi eslatmalar, kuzatuvlar, taassurotlar — uzoq yozsa ham bo‘ladi.",
      rate:"Baho", save:"Saqlash", saving:"Saqlanmoqda…", cancel:"Bekor qilish",
      savefail:"Saqlab bo‘lmadi. Qayta urinib ko‘ring.",
      count:function(n,d,tt){ return "Ko‘rsatildi <b>"+n+"</b> · ko‘rilgan <b>"+d+"</b> / "+tt; },
      L:{ citizenship:"Fuqarolik", email:"E-mail", phone:"Telefon",
        parent_name:"Ota-ona / vakil", parent_relation:"Kim bo‘ladi", parent_phone:"Ota-ona telefoni",
        parent_email:"Ota-ona e-mail", parent_consent:"Ota-ona roziligi",
        rule_agree:"Qoidaga rozi", piece:"Asar", genre:"Janr", education:"Musiqiy ta’lim",
        instruments:"Cholg‘ular", years_singing:"Kuylash staji", vocal_teacher:"Ustoz", contests:"Tanlov/shou", video:"Video",
        why:"Nega ishtirok etadi", music_means:"Musiqa nima degani", three_words:"O‘zi haqida uch so‘z",
        idol:"Kumiri", hobbies:"Qiziqishlari", free_time:"Bo‘sh vaqti",
        father_name:"Otasi", father_job:"Otasi ishi", mother_name:"Onasi", mother_job:"Onasi ishi",
        siblings:"Aka-uka / opa-singil", live_with:"Kim bilan yashaydi", support:"Kim qo‘llaydi",
        chronic:"Surunkali kasalliklar", allergy:"Allergiya", emergency_contact:"Favqulodda kontakt",
        log_attend:"Shaxsan keladi", log_stages:"Bosqichlarga tayyor", log_travel:"Sayohatga tayyor",
        consent_data:"Rozilik: ma’lumot", consent_media:"Rozilik: media", consent_rules:"Rozilik: qoidalar",
        consent_true:"Ma’lumot to‘g‘ri", lang:"Til", submissionId:"ID" },
      G:{ contacts:"Kontaktlar", parent:"Ota-ona", creative:"Ijod", about:"O‘zi haqida", family:"Oila", health:"Sog‘liq", consents:"Logistika va roziliklar" }
    }
  };
  function tr(){ return T[lang]||T.ru; }

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function isBool(v){ return v==="Ha"||v==="—"; }
  function genderLabel(v){ return v==="m"?tr().male:v==="f"?tr().female:(v||""); }
  function fmtDate(iso){ if(!iso) return ""; var d=new Date(iso); if(isNaN(d)) return String(iso);
    var p=function(n){return (n<10?"0":"")+n;}; return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
  function socialUrl(kind,val){ var v=String(val).trim(), h=v.replace(/^@/,"");
    if(/^https?:\/\//i.test(v)) return v;
    if(kind==="instagram") return "https://instagram.com/"+h;
    if(kind==="tiktok") return "https://tiktok.com/@"+h;
    if(kind==="telegram") return "https://t.me/"+h;
    if(kind==="youtube") return "https://youtube.com/@"+h; return v; }
  function api(payload){ return fetch(ENDPOINT,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload), redirect:"follow" }).then(function(r){ return r.json(); }); }

  /* ---- theme + language ---- */
  function applyTheme(){ document.documentElement.classList.toggle("light", theme==="light");
    var ic=(theme==="light"?ICN.moon:ICN.sun);
    if($("themeBtn")) $("themeBtn").innerHTML=ic; if($("themeBtn2")) $("themeBtn2").innerHTML=ic;
    if($("refresh")) $("refresh").innerHTML=ICN.refresh; if($("revX")) $("revX").innerHTML=ICN.close; }
  function toggleTheme(){ theme=(theme==="light"?"dark":"light"); try{localStorage.setItem(THEME_STORE,theme);}catch(e){} applyTheme(); }
  function toggleLang(){ lang=(lang==="ru"?"uz":"ru"); try{localStorage.setItem(LANG_STORE,lang);}catch(e){} applyLang(); }
  function applyLang(){
    var x=tr(), other=(lang==="ru"?"UZ":"RU");
    if($("langBtn")) $("langBtn").textContent=other; if($("langBtn2")) $("langBtn2").textContent=other;
    $("l_title").textContent=x.title; $("a_title").textContent=x.title;
    $("l_sub").textContent=x.sub; $("pw").placeholder=x.pw; $("l_enter").textContent=x.enter;
    $("logout").textContent=x.logout;
    $("q").placeholder=x.search;
    var segt=$("fStatus").querySelectorAll(".segf__t");
    var segv=[x.seg_all,x.seg_no,x.seg_any,x.seg_green,x.seg_yellow,x.seg_red];
    for(var i=0;i<segt.length;i++) segt[i].textContent=segv[i];
    $("revHistLabel").textContent=x.hist_h; $("revTa").placeholder=x.hist_ph;
    $("revRateLabel").textContent=x.rate; $("revCancel").textContent=x.cancel;
    $("revSave").querySelector(".rvlbl").textContent=x.save;
    if(!$("app").hidden){ buildFilters(); render(false); }
  }

  /* ---- auth ---- */
  function loadList(key){
    return api({ action:"list", key:key }).then(function(res){
      if(res && res.error==="forbidden") throw new Error(tr().wrongpw);
      if(!res || res.ok!==true || !Array.isArray(res.rows)) throw new Error(tr().needscript);
      state.key=key; state.rows=res.rows||[];
      try{ sessionStorage.setItem(KEY_STORE,key); }catch(e){}
    });
  }
  $("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var btn=$("loginBtn"); btn.classList.add("is-loading"); $("loginErr").textContent="";
    loadList($("pw").value.trim()).then(showApp)
      .catch(function(ex){ $("loginErr").textContent=ex.message||"Error"; })
      .then(function(){ btn.classList.remove("is-loading"); });
  });
  $("logout").addEventListener("click", function(){ try{ sessionStorage.removeItem(KEY_STORE); }catch(e){} location.reload(); });
  $("refresh").addEventListener("click", function(){
    $("content").innerHTML='<div class="state"><div class="spin"></div>'+esc(tr().refreshing)+'</div>';
    loadList(state.key).then(function(){ buildFilters(); render(true); });
  });
  $("langBtn").addEventListener("click",toggleLang); $("langBtn2").addEventListener("click",toggleLang);
  $("themeBtn").addEventListener("click",toggleTheme); $("themeBtn2").addEventListener("click",toggleTheme);

  function showApp(){ $("login").hidden=true; $("app").hidden=false; buildFilters(); render(true); }
  function buildFilters(){
    var g={}; state.rows.forEach(function(r){ if(r.genre) g[String(r.genre).trim()]=1; });
    var el=$("fGenre"), cur=el.value, opts=Object.keys(g).sort();
    el.innerHTML='<option value="">'+esc(tr().f_genre)+'</option>'+opts.map(function(o){return '<option>'+esc(o)+'</option>';}).join("");
    if(opts.indexOf(cur)>=0) el.value=cur;
  }
  $("fStatus").addEventListener("click", function(e){
    var b=e.target.closest(".segf__b"); if(!b) return;
    state.fStatus=b.getAttribute("data-v")||"";
    $("fStatus").querySelectorAll(".segf__b").forEach(function(x){ x.classList.toggle("is-on", x===b); });
    render(false);
  });
  $("q").addEventListener("input",function(){render(false);});
  $("fGenre").addEventListener("change",function(){render(false);});

  function render(animate){
    var q=$("q").value.trim().toLowerCase(), st=state.fStatus, gn=$("fGenre").value, x=tr();
    var list=state.rows.filter(function(r){
      if(st==="no" && r.reviewed) return false;
      if(st==="any" && !r.reviewed) return false;
      if((st==="green"||st==="yellow"||st==="red") && r.status!==st) return false;
      if(gn && String(r.genre).trim()!==gn) return false;
      if(q){ var hay=[r.fullname,r.phone,r.region,r.piece,r.genre,r.email,r.instagram,r.tiktok,r.telegram,r.history]
        .map(function(z){return String(z==null?"":z).toLowerCase();}).join(" "); if(hay.indexOf(q)<0) return false; }
      return true;
    });
    var done=state.rows.filter(function(r){return r.reviewed;}).length;
    $("count").innerHTML=x.count(list.length,done,state.rows.length);
    if(!state.rows.length){ $("content").innerHTML='<div class="state"><h3>'+esc(x.empty_h)+'</h3><p>'+esc(x.empty_p)+'</p></div>'; return; }
    if(!list.length){ $("content").innerHTML='<div class="state"><h3>'+esc(x.none_h)+'</h3><p>'+esc(x.none_p)+'</p></div>'; return; }
    $("content").innerHTML='<div class="grid'+(animate?'':' no-anim')+'">'+list.map(function(r,i){return card(r,i);}).join("")+'</div>';
  }

  function L(k){ return tr().L[k]||k; }
  function kv(k,v,link){ var val=(v==null||v==="")?'<span class="no">—</span>':(link?'<a href="'+esc(link)+'">'+esc(v)+'</a>':esc(v));
    return '<div class="kvline"><span class="k">'+esc(L(k))+'</span><span class="v">'+val+'</span></div>'; }
  function metaLine(r){ var p=[];
    if(r.age) p.push(esc(r.age)+' '+esc(tr().years));
    if(r.gender) p.push(esc(genderLabel(r.gender)));
    if(r.region) p.push(esc(r.region));
    if(r.lang) p.push(esc(String(r.lang).toUpperCase()));
    return p.length?'<div class="meta">'+p.map(function(z){return '<span>'+z+'</span>';}).join("")+'</div>':""; }
  function socsRow(r){ var it=[["instagram","Instagram"],["tiktok","TikTok"],["telegram","Telegram"],["youtube","YouTube"]]
    .filter(function(s){return r[s[0]];})
    .map(function(s){ return '<a href="'+esc(socialUrl(s[0],r[s[0]]))+'" target="_blank" rel="noopener">'+s[1]+'</a>'; });
    return it.length?'<div class="kvline"><span class="k">'+esc(tr().socials)+'</span><span class="v">'+it.join(' · ')+'</span></div>':""; }
  function histBlock(r){ if(!r.history || !String(r.history).trim()) return "";
    return '<div class="ac__hist"><p class="ac__hist-h">'+esc(tr().hist_h)+'</p><p class="ac__hist-t">'+esc(r.history)+'</p></div>'; }
  function dval(k,v){ if(v==null||v==="") return '<span class="no">—</span>';
    if(k==="submissionId") return esc(v); if(isBool(v)) return v==="Ha"?'<span class="yes">'+esc(tr().yes)+'</span>':'<span class="no">'+esc(tr().no)+'</span>'; return esc(v); }
  function grp(r,g){ var rows=g.keys.filter(function(k){return r[k]!=null&&r[k]!=="";}).map(function(k){return '<dt>'+esc(L(k))+'</dt><dd>'+dval(k,r[k])+'</dd>';});
    return rows.length?'<div class="g"><h4>'+esc(tr().G[g.id]||g.id)+'</h4><dl>'+rows.join("")+'</dl></div>':""; }

  function card(r,i){
    var id=esc(r.submissionId||""), x=tr();
    var det=GROUPS.map(function(g){return grp(r,g);}).join("");
    var delay=Math.min(i*0.035,0.5);
    return ''+
      '<article class="acard'+(r.reviewed?' is-reviewed':'')+'" data-id="'+id+'" data-status="'+esc(r.status||"")+'" style="animation-delay:'+delay+'s">'+
        '<div class="ac__top">'+
          '<h3 class="ac__name">'+esc(r.fullname||"—")+'</h3>'+
          '<div class="ac__end"><span class="ac__date">'+esc(fmtDate(r.submittedAt))+'</span><span class="ac__dot" aria-hidden="true"></span></div>'+
        '</div>'+
        metaLine(r)+
        kv("phone", r.phone, r.phone?("tel:"+String(r.phone).replace(/\s/g,"")):"")+
        kv("genre", r.genre)+ kv("piece", r.piece)+ socsRow(r)+
        histBlock(r)+
        '<div class="ac__foot">'+
          '<button class="rvbtn" data-act="review" type="button">'+ICN.note+'<span>'+esc(x.review)+'</span></button>'+
          (det?'<button class="expand" data-act="expand" type="button">'+esc(x.more)+' ▾</button>':'')+
        '</div>'+
        (det?'<div class="det" hidden>'+det+'</div>':'')+
      '</article>';
  }

  $("content").addEventListener("click", function(e){
    var btn=e.target.closest("button"); if(!btn) return;
    var cardEl=e.target.closest(".acard"); if(!cardEl) return;
    var id=cardEl.getAttribute("data-id");
    if(btn.dataset.act==="expand"){
      var det=cardEl.querySelector(".det"); if(det){ det.hidden=!det.hidden; btn.textContent=(det.hidden?tr().more:tr().less)+(det.hidden?" ▾":" ▴"); }
      return;
    }
    if(btn.dataset.act==="review"){ openReview(id); }
  });

  /* ---- review dialog: history + colour saved together ---- */
  function rowById(id){ for(var i=0;i<state.rows.length;i++){ if(String(state.rows[i].submissionId)===String(id)) return state.rows[i]; } return null; }
  function autogrow(ta){ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight+2, Math.round(window.innerHeight*0.48))+"px"; }
  function setSwatch(s){ rev.status=s||""; $("revSwatches").querySelectorAll(".sw").forEach(function(b){ b.classList.toggle("is-on",(b.getAttribute("data-s")||"")===rev.status); });
    $("revSwatches").querySelectorAll(".sw[data-s]").forEach(function(b){ if(b.getAttribute("data-s")) b.innerHTML=ICN.check; }); }
  function openReview(id){
    var row=rowById(id); if(!row) return; rev.id=id;
    $("revName").textContent=row.fullname||"—";
    $("revSub").textContent=[row.phone,row.region].filter(Boolean).join(" · ");
    var ta=$("revTa"); ta.value=row.history||""; $("revErr").textContent="";
    setSwatch(row.status||"");
    var dlg=$("rev"); if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
    requestAnimationFrame(function(){ autogrow(ta); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); });
  }
  function closeReview(){ var dlg=$("rev"); if(dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
  $("revTa").addEventListener("input", function(){ autogrow(this); });
  $("revSwatches").addEventListener("click", function(e){ var b=e.target.closest(".sw"); if(!b) return; e.preventDefault(); setSwatch(b.getAttribute("data-s")||""); });
  $("revX").addEventListener("click", closeReview);
  $("revCancel").addEventListener("click", closeReview);
  $("rev").addEventListener("click", function(e){ if(e.target===this) closeReview(); }); // backdrop
  $("revSave").addEventListener("click", function(){
    var id=rev.id; if(!id) return;
    var hist=$("revTa").value, status=rev.status||"";
    var btn=$("revSave"), lbl=btn.querySelector(".rvlbl"), old=lbl.textContent;
    btn.disabled=true; lbl.textContent=tr().saving; $("revErr").textContent="";
    api({ action:"review", key:state.key, submissionId:id, status:status, history:hist }).then(function(res){
      if(!res||res.ok!==true) throw new Error((res&&res.error)||"error");
      var row=rowById(id);
      if(row){ row.status=res.status||""; row.history=(res.history!=null?res.history:hist); row.reviewed=row.status!==""; }
      btn.disabled=false; lbl.textContent=old;
      closeReview(); buildFilters(); render(false);
    }).catch(function(){ btn.disabled=false; lbl.textContent=old; $("revErr").textContent=tr().savefail; });
  });

  /* ---- boot ---- */
  applyTheme(); applyLang();
  (function(){
    var key=null; try{ key=sessionStorage.getItem(KEY_STORE); }catch(e){}
    if(!key) return;
    $("login").hidden=true;
    document.body.insertAdjacentHTML("afterbegin",'<div class="state" id="boot"><div class="spin"></div>'+esc(tr().loading)+'</div>');
    loadList(key).then(function(){ var b=$("boot"); if(b) b.remove(); showApp(); })
      .catch(function(){ var b=$("boot"); if(b) b.remove(); $("login").hidden=false; });
  })();
</script>
</body>
</html>
