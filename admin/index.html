<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>UPOP — Заявки</title>
<link rel="icon" href="/logo-nav.webp" type="image/webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet" />
<!-- reuse the website's own design system (tokens, buttons, fonts, colours) -->
<link rel="stylesheet" href="/css/styles.css" />
<style>
  body{ background:var(--bg); min-height:100vh; }
  a{ color:inherit; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 clamp(16px,4vw,40px); }

  .abar{ position:sticky; top:0; z-index:20; background:rgba(5,12,17,.82);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line-gold); }
  .abar__in{ display:flex; align-items:center; gap:16px; padding:14px 0; }
  .abar__brand{ display:flex; align-items:center; gap:11px; font-family:var(--font-disp); font-weight:700; font-size:1.05rem; }
  .abar__brand img{ height:30px; width:auto; display:block; }
  .abar__sp{ flex:1; }
  .cnt{ font-size:.9rem; color:var(--ink-70); white-space:nowrap; }
  .cnt b{ color:var(--gold-hi); }
  .ghost{ appearance:none; border:1px solid var(--line-gold); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:9px 14px; font:inherit; font-size:.85rem; font-weight:700; cursor:pointer; transition:.18s; }
  .ghost:hover{ border-color:var(--gold); background:var(--surface-2); }

  .tools{ display:flex; flex-wrap:wrap; gap:12px; padding:22px 0 4px; }
  .srch{ position:relative; flex:1 1 300px; min-width:200px; }
  .srch svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.5; }
  .srch input,.tools select{ width:100%; font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:var(--r-input); padding:13px 15px; transition:.2s; }
  .srch input{ padding-left:42px; }
  .srch input:focus,.tools select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }
  .tools .sel{ position:relative; }
  .tools select{ appearance:none; font-weight:700; padding-right:38px; cursor:pointer; }
  .tools .sel::after{ content:""; position:absolute; right:15px; top:50%; width:7px; height:7px; pointer-events:none;
    border-right:2px solid var(--ink-70); border-bottom:2px solid var(--ink-70); transform:translateY(-70%) rotate(45deg); }
  .tools select option{ background:#0A1E28; color:var(--ink); }

  /* ---- uniform card grid ---- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr)); gap:16px; padding:18px 0 70px; align-items:stretch; }
  .acard{ position:relative; display:flex; flex-direction:column; height:100%;
    background:linear-gradient(180deg,var(--surface),var(--bg-2)); border:1px solid var(--line);
    border-radius:var(--r-card); padding:18px; overflow:hidden; box-shadow:0 18px 44px -30px rgba(0,0,0,.8);
    transition:border-color .2s, transform .18s var(--e-quint), box-shadow .2s;
    animation:acIn .5s var(--e-quint) both; }
  @keyframes acIn{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
  .grid.no-anim .acard{ animation:none; }
  .acard::before{ content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--metal); transition:background .3s; }
  .acard:hover{ border-color:var(--line-gold); transform:translateY(-3px); box-shadow:0 26px 54px -30px rgba(0,0,0,.9); }
  .acard[data-status="green"]::before{ background:linear-gradient(90deg,#2e7d5b,#7fe0a8); }
  .acard[data-status="yellow"]::before{ background:linear-gradient(90deg,#c99a2e,#ffdd7a); }
  .acard[data-status="red"]::before{ background:linear-gradient(90deg,#a83232,#ff8f8f); }
  .acard.is-reviewed{ border-color:var(--line-gold); }

  .ac__top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:11px; }
  .ac__name{ font-family:var(--font-disp); font-weight:600; font-size:1.05rem; line-height:1.28;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ac__date{ font-size:.73rem; color:var(--ink-50); white-space:nowrap; padding-top:4px; }

  .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .tag{ font-size:.74rem; font-weight:700; padding:4px 9px; border-radius:999px;
    background:rgba(211,166,63,.12); color:var(--gold-hi); border:1px solid var(--line-gold); }
  .tag--v{ background:rgba(106,57,217,.18); color:#c9bcff; border-color:rgba(106,57,217,.34); }

  .kvline{ display:flex; gap:10px; font-size:.9rem; margin:6px 0; align-items:baseline; }
  .kvline .k{ color:var(--ink-50); flex:0 0 74px; font-size:.8rem; }
  .kvline .v{ color:var(--ink); font-weight:500; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kvline .v a{ color:var(--gold-hi); text-decoration:none; }
  .socs{ display:flex; flex-wrap:wrap; gap:7px; margin:11px 0 2px; }
  .soc{ font-size:.78rem; font-weight:700; text-decoration:none; padding:5px 10px; border-radius:9px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink-70); transition:.15s; }
  .soc:hover{ border-color:var(--gold); color:var(--gold-hi); }

  .ac__foot{ display:flex; align-items:center; gap:12px; margin-top:auto; padding-top:14px; border-top:1px solid var(--line); }
  .foot-label{ font-size:.74rem; color:var(--ink-50); }
  .dots{ display:flex; gap:8px; }
  .dot{ width:24px; height:24px; padding:0; border-radius:50%; background:transparent; cursor:pointer; border:2px solid;
    transition:transform .14s var(--e-quint), box-shadow .2s, background .2s; -webkit-tap-highlight-color:transparent; }
  .dot--green{ border-color:#3fbf6f; } .dot--yellow{ border-color:#e6b93e; } .dot--red{ border-color:#e56464; }
  .dot:hover{ transform:scale(1.16); }
  .dot:active{ transform:scale(.9); }
  .acard[data-status="green"] .dot--green{ background:#3fbf6f; box-shadow:0 0 0 3px rgba(63,191,111,.3); }
  .acard[data-status="yellow"] .dot--yellow{ background:#e6b93e; box-shadow:0 0 0 3px rgba(230,185,62,.3); }
  .acard[data-status="red"] .dot--red{ background:#e56464; box-shadow:0 0 0 3px rgba(229,100,100,.3); }
  .dots.busy{ opacity:.4; pointer-events:none; }
  .expand{ margin-left:auto; font-size:.82rem; font-weight:700; color:var(--ink-70); cursor:pointer;
    background:none; border:0; font-family:inherit; white-space:nowrap; }
  .expand:hover{ color:var(--gold-hi); }

  .det{ margin-top:12px; }
  .det .g{ margin-top:12px; }
  .det .g h4{ margin:0 0 6px; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); font-weight:700; }
  .det dl{ display:grid; grid-template-columns:120px 1fr; gap:4px 12px; font-size:.86rem; margin:0; }
  .det dt{ color:var(--ink-50); } .det dd{ margin:0; color:var(--ink); word-break:break-word; }
  .yes{ color:#7fe0a8; font-weight:700; } .no{ color:var(--ink-50); }

  .state{ text-align:center; padding:80px 20px; color:var(--ink-70); }
  .state h3{ font-family:var(--font-disp); color:var(--ink); margin:0 0 8px; }
  .spin{ width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--gold);
    border-radius:50%; margin:0 auto 18px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .login{ min-height:100vh; display:grid; place-items:center; padding:24px; }
  .login__card{ width:100%; max-width:390px; background:linear-gradient(180deg,var(--surface),var(--bg-2));
    border:1px solid var(--line-gold); border-radius:var(--r-card); padding:34px 28px; text-align:center;
    box-shadow:0 26px 60px -30px rgba(0,0,0,.85); animation:acIn .5s var(--e-quint) both; }
  .login__card img{ height:54px; margin:0 auto 16px; display:block; }
  .login__card h1{ font-family:var(--font-disp); font-weight:700; font-size:1.35rem; margin:0 0 6px; }
  .login__card p{ color:var(--ink-70); font-size:.9rem; margin:0 0 22px; }
  .login__card input{ width:100%; padding:14px 16px; font:inherit; color:var(--ink); text-align:center; letter-spacing:.05em;
    background:var(--bg); border:1px solid var(--line); border-radius:var(--r-input); margin-bottom:14px; }
  .login__card input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }
  .err{ color:#ff8fb0; font-size:.86rem; margin-top:12px; min-height:1em; }
  [hidden]{ display:none!important; }

  @media (max-width:560px){
    .abar__in{ flex-wrap:wrap; gap:10px 12px; } .abar__sp{ display:none; } .cnt{ order:5; flex-basis:100%; }
    .tools .sel{ flex:1 1 46%; } .det dl{ grid-template-columns:110px 1fr; }
  }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<section class="login" id="login">
  <div class="login__card">
    <img src="/logo-hero.png" alt="U POP TREND" />
    <h1 class="hl">Заявки</h1>
    <p>Введите пароль администратора</p>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" required />
      <button class="btn btn--pop btn--block" type="submit" id="loginBtn"><span class="btn__label">Войти</span></button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</section>

<!-- ===== APP ===== -->
<div id="app" hidden>
  <header class="abar">
    <div class="wrap abar__in">
      <a class="abar__brand" href="/"><img src="/logo-hero.png" alt="" /> <span class="hl">Заявки</span></a>
      <div class="abar__sp"></div>
      <span class="cnt" id="count"></span>
      <button class="ghost" id="refresh">↻ Обновить</button>
      <button class="ghost" id="logout">Выйти</button>
    </div>
  </header>

  <div class="wrap">
    <div class="tools">
      <label class="srch">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Поиск: имя, телефон, город, произведение…" autocomplete="off" />
      </label>
      <div class="sel"><select id="fStatus">
        <option value="">Все заявки</option>
        <option value="no">Не рассмотренные</option>
        <option value="any">Рассмотренные</option>
        <option value="green">🟢 Зелёные</option>
        <option value="yellow">🟡 Жёлтые</option>
        <option value="red">🔴 Красные</option>
      </select></div>
      <div class="sel"><select id="fGenre"><option value="">Жанр: все</option></select></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
  var ENDPOINT = "https://script.google.com/macros/s/AKfycby7z5nB-DfFxk6tBGVCFkMQNpPCdNbHI9DSURAMYiUt8GKPasqRNULcyG-A3lZzZzEIwQ/exec";
  var KEY_STORE = "upop_admin_key";
  var state = { rows: [], key: "" };

  var LABEL = {
    citizenship:"Гражданство", email:"E-mail", phone:"Телефон",
    parent_name:"Родитель/представитель", parent_relation:"Кем приходится", parent_phone:"Телефон родителя",
    parent_email:"E-mail родителя", parent_consent:"Согласие родителя",
    rule_agree:"Согласен с правилами", piece:"Произведение", genre:"Жанр", education:"Муз. образование",
    instruments:"Инструменты", years_singing:"Стаж пения", vocal_teacher:"Педагог", contests:"Конкурсы/шоу", video:"Видео",
    why:"Почему участвует", music_means:"Что для него музыка", three_words:"Три слова о себе",
    idol:"Кумир", hobbies:"Увлечения", free_time:"Свободное время",
    father_name:"Отец", father_job:"Работа отца", mother_name:"Мать", mother_job:"Работа матери",
    siblings:"Братья/сёстры", live_with:"С кем живёт", support:"Кто поддерживает",
    chronic:"Хрон. болезни", allergy:"Аллергия", emergency_contact:"Экстренный контакт",
    log_attend:"Придёт лично", log_stages:"Готов к этапам", log_travel:"Готов к поездкам",
    consent_data:"Согл.: данные", consent_media:"Согл.: медиа", consent_rules:"Согл.: правила",
    consent_true:"Данные верны", lang:"Язык", submissionId:"ID"
  };
  var GROUPS = [
    { t:"Контакты", keys:["phone","email","citizenship"] },
    { t:"Родитель", keys:["parent_name","parent_relation","parent_phone","parent_email","parent_consent"] },
    { t:"Творчество", keys:["piece","genre","education","instruments","years_singing","vocal_teacher","contests","video","rule_agree"] },
    { t:"О себе", keys:["why","music_means","three_words","idol","hobbies","free_time"] },
    { t:"Семья", keys:["father_name","father_job","mother_name","mother_job","siblings","live_with","support"] },
    { t:"Здоровье", keys:["chronic","allergy","emergency_contact"] },
    { t:"Логистика и согласия", keys:["log_attend","log_stages","log_travel","consent_data","consent_media","consent_rules","consent_true","lang","submissionId"] }
  ];

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function isBool(v){ return v==="Ha"||v==="—"; }
  function genderLabel(v){ return v==="m"?"Мужской":v==="f"?"Женский":(v||""); }
  function fmtDate(iso){ if(!iso) return ""; var d=new Date(iso); if(isNaN(d)) return String(iso);
    var p=function(n){return (n<10?"0":"")+n;}; return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
  function socialUrl(kind,val){ var v=String(val).trim(), h=v.replace(/^@/,"");
    if(/^https?:\/\//i.test(v)) return v;
    if(kind==="instagram") return "https://instagram.com/"+h;
    if(kind==="tiktok") return "https://tiktok.com/@"+h;
    if(kind==="telegram") return "https://t.me/"+h;
    if(kind==="youtube") return "https://youtube.com/@"+h; return v; }

  function api(payload){
    return fetch(ENDPOINT,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload), redirect:"follow" }).then(function(r){ return r.json(); });
  }

  function loadList(key){
    return api({ action:"list", key:key }).then(function(res){
      if(res && res.error==="forbidden") throw new Error("Неверный пароль");
      if(!res || res.ok!==true || !Array.isArray(res.rows)) throw new Error("Обновите скрипт таблицы (команда list не найдена)");
      state.key=key; state.rows=res.rows||[];
      try{ sessionStorage.setItem(KEY_STORE,key); }catch(e){}
    });
  }
  $("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var btn=$("loginBtn"); btn.classList.add("is-loading"); $("loginErr").textContent="";
    loadList($("pw").value.trim()).then(showApp)
      .catch(function(ex){ $("loginErr").textContent=ex.message||"Ошибка"; })
      .then(function(){ btn.classList.remove("is-loading"); });
  });
  $("logout").addEventListener("click", function(){ try{ sessionStorage.removeItem(KEY_STORE); }catch(e){} location.reload(); });
  $("refresh").addEventListener("click", function(){
    $("content").innerHTML='<div class="state"><div class="spin"></div>Обновляю…</div>';
    loadList(state.key).then(function(){ buildFilters(); render(true); });
  });

  function showApp(){ $("login").hidden=true; $("app").hidden=false; buildFilters(); render(true); }
  function buildFilters(){
    var g={}; state.rows.forEach(function(r){ if(r.genre) g[String(r.genre).trim()]=1; });
    var el=$("fGenre"), cur=el.value, opts=Object.keys(g).sort();
    el.innerHTML='<option value="">Жанр: все</option>'+opts.map(function(o){return '<option>'+esc(o)+'</option>';}).join("");
    if(opts.indexOf(cur)>=0) el.value=cur;
  }
  ["q","fStatus","fGenre"].forEach(function(id){
    $(id).addEventListener("input",function(){render(false);}); $(id).addEventListener("change",function(){render(false);});
  });

  function render(animate){
    var q=$("q").value.trim().toLowerCase(), st=$("fStatus").value, gn=$("fGenre").value;
    var list=state.rows.filter(function(r){
      if(st==="no" && r.reviewed) return false;
      if(st==="any" && !r.reviewed) return false;
      if((st==="green"||st==="yellow"||st==="red") && r.status!==st) return false;
      if(gn && String(r.genre).trim()!==gn) return false;
      if(q){ var hay=[r.fullname,r.phone,r.region,r.piece,r.genre,r.email,r.instagram,r.tiktok,r.telegram]
        .map(function(x){return String(x==null?"":x).toLowerCase();}).join(" "); if(hay.indexOf(q)<0) return false; }
      return true;
    });
    var done=state.rows.filter(function(r){return r.reviewed;}).length;
    $("count").innerHTML="Показано <b>"+list.length+"</b> · рассмотрено <b>"+done+"</b> из "+state.rows.length;
    if(!state.rows.length){ $("content").innerHTML='<div class="state"><h3>Пока нет заявок</h3><p>Как только кто-то отправит анкету — она появится здесь.</p></div>'; return; }
    if(!list.length){ $("content").innerHTML='<div class="state"><h3>Ничего не найдено</h3><p>Измените поиск или фильтр.</p></div>'; return; }
    $("content").innerHTML='<div class="grid'+(animate?'':' no-anim')+'">'+list.map(function(r,i){return card(r,i);}).join("")+'</div>';
  }

  function kv(k,v,link){ var val=(v==null||v==="")?'<span class="no">—</span>':(link?'<a href="'+esc(link)+'">'+esc(v)+'</a>':esc(v));
    return '<div class="kvline"><span class="k">'+esc(LABEL[k]||k)+'</span><span class="v">'+val+'</span></div>'; }
  function socs(r){ var it=[["instagram","IG"],["tiktok","TikTok"],["telegram","TG"],["youtube","YT"]].filter(function(s){return r[s[0]];})
    .map(function(s){ return '<a class="soc" target="_blank" rel="noopener" href="'+esc(socialUrl(s[0],r[s[0]]))+'">'+s[1]+'</a>'; });
    return it.length?'<div class="socs">'+it.join("")+'</div>':""; }
  function dval(k,v){ if(v==null||v==="") return '<span class="no">—</span>';
    if(k==="submissionId") return esc(v); if(isBool(v)) return v==="Ha"?'<span class="yes">✓ Да</span>':'<span class="no">— Нет</span>'; return esc(v); }
  function grp(r,g){ var rows=g.keys.filter(function(k){return r[k]!=null&&r[k]!=="";}).map(function(k){return '<dt>'+esc(LABEL[k]||k)+'</dt><dd>'+dval(k,r[k])+'</dd>';});
    return rows.length?'<div class="g"><h4>'+esc(g.t)+'</h4><dl>'+rows.join("")+'</dl></div>':""; }

  function card(r,i){
    var id=esc(r.submissionId||"");
    var tags=[];
    if(r.age) tags.push('<span class="tag">'+esc(r.age)+' лет</span>');
    if(r.gender) tags.push('<span class="tag">'+esc(genderLabel(r.gender))+'</span>');
    if(r.region) tags.push('<span class="tag tag--v">'+esc(r.region)+'</span>');
    if(r.lang) tags.push('<span class="tag tag--v">'+esc(String(r.lang).toUpperCase())+'</span>');
    var det=GROUPS.map(function(g){return grp(r,g);}).join("");
    var delay=Math.min(i*0.035,0.5);
    return ''+
      '<article class="acard'+(r.reviewed?' is-reviewed':'')+'" data-id="'+id+'" data-status="'+esc(r.status||"")+'" style="animation-delay:'+delay+'s">'+
        '<div class="ac__top"><div class="ac__name">'+esc(r.fullname||"Без имени")+'</div>'+
          '<div class="ac__date">'+esc(fmtDate(r.submittedAt))+'</div></div>'+
        '<div class="tags">'+tags.join("")+'</div>'+
        kv("phone", r.phone, r.phone?("tel:"+String(r.phone).replace(/\s/g,"")):"")+
        kv("genre", r.genre)+ kv("piece", r.piece)+ socs(r)+
        '<div class="ac__foot">'+
          '<span class="foot-label">Оценка:</span>'+
          '<span class="dots">'+
            '<button class="dot dot--green" data-s="green" title="Зелёный" aria-label="Зелёный"></button>'+
            '<button class="dot dot--yellow" data-s="yellow" title="Жёлтый" aria-label="Жёлтый"></button>'+
            '<button class="dot dot--red" data-s="red" title="Красный" aria-label="Красный"></button>'+
          '</span>'+
          (det?'<button class="expand" data-act="expand">Подробнее ▾</button>':'')+
        '</div>'+
        (det?'<div class="det" hidden>'+det+'</div>':'')+
      '</article>';
  }

  $("content").addEventListener("click", function(e){
    var btn=e.target.closest("button"); if(!btn) return;
    var cardEl=e.target.closest(".acard"); if(!cardEl) return;
    var id=cardEl.getAttribute("data-id");
    if(btn.dataset.act==="expand"){
      var det=cardEl.querySelector(".det"); if(det){ det.hidden=!det.hidden; btn.textContent=det.hidden?"Подробнее ▾":"Свернуть ▴"; }
      return;
    }
    if(btn.dataset.s){
      var row=state.rows.filter(function(r){return String(r.submissionId)===id;})[0]; if(!row) return;
      var color=btn.dataset.s;
      var next=(row.status===color) ? "" : color;
      var dots=cardEl.querySelector(".dots"); dots.classList.add("busy");
      api({ action:"setStatus", key:state.key, submissionId:id, status:next }).then(function(res){
        if(!res||res.ok!==true) throw new Error(res&&res.error||"error");
        row.status=res.status||""; row.reviewed=row.status!=="";
        // update this card in place (no full re-render) for a smooth feel…
        cardEl.setAttribute("data-status", row.status);
        cardEl.classList.toggle("is-reviewed", row.reviewed);
        dots.classList.remove("busy");
        // …unless a status filter would now hide/show it — then refresh the view
        var f=$("fStatus").value;
        if(f) render(false);
        // keep the counter fresh
        var done=state.rows.filter(function(r){return r.reviewed;}).length;
        $("count").innerHTML="Показано <b>"+document.querySelectorAll('.acard').length+"</b> · рассмотрено <b>"+done+"</b> из "+state.rows.length;
      }).catch(function(){ dots.classList.remove("busy"); alert("Не удалось сохранить оценку. Попробуйте ещё раз."); });
    }
  });

  (function(){
    var key=null; try{ key=sessionStorage.getItem(KEY_STORE); }catch(e){}
    if(!key) return;
    $("login").hidden=true;
    document.body.insertAdjacentHTML("afterbegin",'<div class="state" id="boot"><div class="spin"></div>Загрузка…</div>');
    loadList(key).then(function(){ var b=$("boot"); if(b) b.remove(); showApp(); })
      .catch(function(){ var b=$("boot"); if(b) b.remove(); $("login").hidden=false; });
  })();
</script>
</body>
</html>
