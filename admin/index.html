<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>UPOP — Заявки</title>
<link rel="icon" href="/logo-nav.webp" type="image/webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* Admin paneli — U POP TREND. teiior
       Saytning dizayn tizimidan faqat kerakli tokenlar va bir nechta komponent.
       Admin 56 KB lik styles.css ni kutmaydi — shu ~18 token va quyidagi .btn / .hl yetarli. */
  *{ box-sizing:border-box; }
  :root{
    --gold:#D3A63F; --gold-hi:#F4E1A0;
    --bg:#050C11; --bg-2:#081A23; --surface:#0A1E28; --surface-2:#0D242F;
    --ink:#F2E4C6; --ink-70:rgba(242,228,198,.72); --ink-50:rgba(242,228,198,.52); --ink-34:rgba(242,228,198,.34);
    --line:rgba(242,228,198,.10); --line-gold:rgba(201,162,90,.24);
    --metal:linear-gradient(160deg,#FCEEB0 0%,#F1D275 18%,#E0B143 40%,#C6922B 56%,#F0CE6C 74%,#A0721E 100%);
    --pop-btn:linear-gradient(135deg,#7457C9 0%,#4E36A8 55%,#372777 100%);
    --e-quint:cubic-bezier(.23,1,.32,1); --e-inout:cubic-bezier(.645,.045,.355,1); --e-cubic:cubic-bezier(.33,1,.68,1);
    --maxw:1200px; --r-card:18px; --r-input:12px;
    --font-sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  html{ -webkit-text-size-adjust:100%; }
  .hl{ background:var(--metal); background-size:220% auto; -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent; animation:none; }
  @keyframes shimmer{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }
  .btn{ position:relative; display:inline-flex; align-items:center; justify-content:center; gap:.55em;
    font-family:var(--font-sans); font-weight:700; font-size:.95rem; letter-spacing:.01em; padding:.7em 1.4em;
    border:0; border-radius:10px; color:var(--ink); background:transparent; cursor:pointer; white-space:nowrap;
    transition:transform .18s var(--e-quint), box-shadow .3s var(--e-quint), filter .3s ease; -webkit-tap-highlight-color:transparent; }
  .btn--block{ width:100%; }
  .btn--pop{ color:#fff; font-weight:800; background:var(--pop-btn); background-size:220% 220%; overflow:hidden;
    box-shadow:0 6px 18px -6px rgba(92,58,178,.55), inset 0 1px 0 rgba(255,255,255,.22); animation:popShift 7s var(--e-inout) infinite; }
  @keyframes popShift{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }
  .btn--pop:hover{ transform:translateY(-2px); scale:1.02;
    box-shadow:0 12px 26px -8px rgba(92,58,178,.6), 0 4px 12px -6px rgba(70,45,140,.5), inset 0 1px 0 rgba(255,255,255,.3); }
  .btn--pop::after{ content:""; position:absolute; inset:0; border-radius:inherit;
    background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.4) 50%,transparent 80%);
    background-size:200% 100%; background-position:200% 0; opacity:0; transition:opacity .3s ease; }
  .btn--pop:hover::after{ opacity:1; animation:sheen 1.5s var(--e-cubic) infinite; }
  .btn--pop:active{ transform:translateY(-1px); scale:.985; }
  @keyframes sheen{ from{ background-position:200% 0; } to{ background-position:-200% 0; } }
  .btn.is-loading{ pointer-events:none; }
  .btn.is-loading .btn__label{ opacity:.55; }
  .btn:disabled,.ghost:disabled{ opacity:.42; cursor:default; pointer-events:none; }

  body{ background:var(--bg); min-height:100vh; margin:0; color:var(--ink); font-family:var(--font-sans);
    font-size:clamp(15px,1.05vw,17px); line-height:1.62; letter-spacing:.006em;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; transition:background .3s ease;
    --st-green:#3fbf6f; --st-yellow:#e6b93e; --st-red:#e56464;
    --tline:rgba(242,228,198,.20); }   /* koʻrinadigan jadval chiziqlari */
  a{ color:inherit; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 clamp(16px,4vw,40px); }

  /* ---------- yuqori panel ---------- */
  .abar{ position:sticky; top:0; z-index:20; background:rgba(5,12,17,.86);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .abar__in{ display:flex; align-items:center; gap:14px; padding:12px 0; }
  .abar__brand{ display:flex; align-items:center; }
  .abar__brand img{ height:30px; width:auto; display:block; }
  .abar__sp{ flex:1; }
  .cnt{ font-size:.9rem; color:var(--ink-50); font-weight:600; padding:14px 2px 0; }
  .cnt b{ color:var(--ink); font-weight:700; }
  .iconbtn,.tgl{ appearance:none; border:1px solid transparent; background:transparent; color:var(--ink-70);
    border-radius:10px; padding:0; width:40px; height:40px; display:inline-grid; place-items:center; cursor:pointer; transition:.16s; }
  .iconbtn:hover,.tgl:hover{ color:var(--ink); background:var(--surface); border-color:var(--line); }
  .iconbtn svg,.tgl svg{ width:18px; height:18px; display:block; }
  .tgl{ font:inherit; font-weight:700; font-size:.84rem; font-family:'Manrope',sans-serif; }
  .ghost{ appearance:none; border:1px solid var(--line); background:transparent; color:var(--ink);
    border-radius:10px; padding:0 14px; height:40px; font:inherit; font-size:.86rem; font-weight:700; cursor:pointer; transition:.16s;
    font-family:'Manrope',sans-serif; letter-spacing:-.01em; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .ghost:hover{ border-color:var(--line-gold); background:var(--surface); }

  /* ---------- asboblar / filtrlar ---------- */
  .tools{ display:flex; flex-wrap:wrap; gap:10px 18px; padding:22px 0 0; align-items:center; }
  .srch{ position:relative; flex:1 1 300px; min-width:200px; }
  .srch svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.45; pointer-events:none; }
  .srch input{ width:100%; height:44px; font:inherit; font-size:.95rem; color:var(--ink); background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:0 14px 0 42px; transition:.2s; }
  .srch input::placeholder{ color:var(--ink-34); }
  .srch input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }

  /* holat filtri: oddiy matn, faoli tagida chiziq — quticha ham, nuqta ham yoʻq */
  .segf{ display:flex; align-items:center; gap:2px; overflow-x:auto; scrollbar-width:none; max-width:100%; height:44px; }
  .segf::-webkit-scrollbar{ display:none; }
  .segf__b{ appearance:none; border:0; background:transparent; color:var(--ink-50); cursor:pointer; white-space:nowrap; position:relative;
    display:inline-flex; align-items:center; padding:0 11px; height:40px; transition:.16s;
    font-family:'Manrope',sans-serif; font-weight:700; font-size:.9rem; letter-spacing:-.01em; }
  .segf__b:hover{ color:var(--ink); }
  .segf__b.is-on{ color:var(--ink); }
  .segf__b.is-on::after{ content:""; position:absolute; left:11px; right:11px; bottom:5px; height:2px; border-radius:2px; background:var(--gold); }
  .segf__b--green,.segf__b--green:hover,.segf__b--green.is-on{ color:var(--st-green); } .segf__b--green.is-on::after{ background:var(--st-green); }
  .segf__b--yellow,.segf__b--yellow:hover,.segf__b--yellow.is-on{ color:var(--st-yellow); } .segf__b--yellow.is-on::after{ background:var(--st-yellow); }
  .segf__b--red,.segf__b--red:hover,.segf__b--red.is-on{ color:var(--st-red); } .segf__b--red.is-on::after{ background:var(--st-red); }

  .sel{ position:relative; }
  .sel select{ font:inherit; height:44px; color:var(--ink); background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:0 38px 0 14px; appearance:none; font-weight:700; cursor:pointer; max-width:220px;
    font-family:'Manrope',sans-serif; font-size:.84rem; letter-spacing:-.01em; }
  .sel select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }
  .sel::after{ content:""; position:absolute; right:15px; top:50%; width:7px; height:7px; pointer-events:none;
    border-right:2px solid var(--ink-70); border-bottom:2px solid var(--ink-70); transform:translateY(-70%) rotate(45deg); }

  /* ---------- nomzod kartasi ---------- */
  .grid{ display:flex; flex-direction:column; align-items:center; gap:18px; padding:14px 0 96px; }
  .grid.no-anim .anketa{ animation:none; }
  .anketa{ width:100%; max-width:1060px; background:var(--surface); border:1px solid var(--line); border-radius:22px;
    padding:26px 28px; box-shadow:0 10px 30px -22px rgba(0,0,0,.55);
    transition:border-color .2s, transform .2s var(--e-quint), box-shadow .2s; animation:acIn .4s var(--e-quint) both; }
  @media (prefers-reduced-motion:reduce){ .anketa{ animation:none; } }
  .iconbtn.is-spin svg{ animation:spin .8s linear infinite; }
  @keyframes acIn{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }
  .anketa:hover{ border-color:var(--line-gold); transform:translateY(-1px); box-shadow:0 14px 36px -24px rgba(0,0,0,.6); }
  .anketa[data-status="green"]{ border-color:color-mix(in srgb, var(--st-green) 52%, var(--line)); }
  .anketa[data-status="yellow"]{ border-color:color-mix(in srgb, var(--st-yellow) 52%, var(--line)); }
  .anketa[data-status="red"]{ border-color:color-mix(in srgb, var(--st-red) 52%, var(--line)); }

  .ank__head{ display:flex; gap:22px; align-items:flex-start; padding-bottom:20px; border-bottom:1px solid var(--line); }
  .ank__photo{ width:112px; height:140px; flex:0 0 auto; border-radius:14px; overflow:hidden; background:var(--surface-2);
    border:1px solid var(--line-gold); display:grid; place-items:center; }
  .ank__photo img{ width:100%; height:100%; object-fit:cover; }
  .ank__photo-ph{ display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--ink-34);
    font-family:'Manrope',sans-serif; font-size:.78rem; font-weight:600; text-align:center; padding:8px; }
  .ank__photo-ph svg{ width:30px; height:30px; opacity:.7; }
  .ank__ident{ flex:1 1 auto; min-width:0; padding-top:4px; }
  .ank__name{ font-family:'Manrope',sans-serif; font-weight:700; font-size:1.5rem; letter-spacing:-.02em; line-height:1.05; margin:0 0 12px; }
  /* asosiy faktlar: kichik yorliq, ostida qalin qiymat — ajratgichsiz */
  .ank__facts{ display:flex; flex-wrap:wrap; gap:10px 28px; margin:0 0 14px; }
  .ank__fact{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .ank__fact .k{ font-family:'Manrope',sans-serif; font-size:.74rem; font-weight:600; color:var(--ink-50); }
  .ank__fact .v{ font-family:'Manrope',sans-serif; font-size:1rem; font-weight:700; color:var(--ink); }
  .ank__contact{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 24px; }
  .ank__ci{ display:inline-flex; align-items:center; gap:8px; color:var(--ink); font-weight:600; font-size:1rem; text-decoration:none; }
  .ank__ci svg{ width:16px; height:16px; color:var(--gold); flex:0 0 auto; }
  .ank__ci:hover{ color:var(--gold-hi); }
  .ank__soc{ color:var(--ink-70); font-weight:600; font-size:.96rem; text-decoration:none; transition:.16s; }
  .ank__soc:hover{ color:var(--gold-hi); }
  .ank__head-end{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:0 0 auto; }
  .ank__date{ font-size:.82rem; color:var(--ink-50); white-space:nowrap; }
  .ank__status{ font-family:'Manrope',sans-serif; font-size:.82rem; font-weight:700; }
  .anketa[data-status="green"] .ank__status{ color:var(--st-green); }
  .anketa[data-status="yellow"] .ank__status{ color:var(--st-yellow); }
  .anketa[data-status="red"] .ank__status{ color:var(--st-red); }

  /* yigʻiladigan tafsilotlar (ochilganda quriladi) — silliq 0fr↔1fr ochilish */
  .ank__reveal{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .34s var(--e-quint); }
  .ank__reveal.open{ grid-template-rows:1fr; }
  .ank__reveal-in{ overflow:hidden; min-height:0; }

  /* tafsilotlar tekis jadval koʻrinishida (kataklar ingichka chiziq bilan), Manrope */
  .ank__body{ margin-top:18px; border:1.5px solid var(--line-gold); border-radius:12px; overflow:hidden; background:var(--surface); }
  .ank__grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin:-1px 0 0 -1px; }
  .ank__cell{ border-top:1px solid var(--tline); border-left:1px solid var(--tline); padding:13px 16px; min-width:0; }
  .ank__cell--h{ grid-column:1 / -1; background:var(--surface-2); padding:11px 16px; border-top:1px solid var(--tline);
    font-family:'Manrope',sans-serif; font-weight:800; font-size:.9rem; letter-spacing:0; text-transform:none; color:var(--gold); }
  .ank__fk{ display:block; font-family:'Manrope',sans-serif; font-weight:600; font-size:.76rem; letter-spacing:0;
    text-transform:none; color:var(--ink-50); margin-bottom:4px; }
  .ank__fv{ display:block; font-family:'Manrope',sans-serif; color:var(--ink); font-size:1rem; line-height:1.45; word-break:break-word; }
  .ank__fv a{ color:var(--gold-hi); text-decoration:none; }
  .yes{ color:#4ec27f; font-weight:700; } .no{ color:var(--ink-34); }

  .ank__hist{ margin-top:18px; padding:0; background:none; border:0; }
  .ank__hist h4{ margin:0 0 6px; font-family:'Manrope',sans-serif; font-weight:800; font-size:1rem; letter-spacing:0; text-transform:none; color:var(--gold); }
  .ank__hist p{ margin:0; white-space:pre-wrap; word-break:break-word; color:var(--ink); font-size:1.04rem; line-height:1.6; }

  .ank__foot{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:22px; padding-top:20px; border-top:1px solid var(--line); }
  .rvbtn,.prbtn{ appearance:none; font:inherit; font-family:'Manrope',sans-serif; font-weight:600; letter-spacing:-.01em; font-size:.9rem;
    display:inline-flex; align-items:center; gap:9px; padding:12px 18px; border-radius:12px; cursor:pointer; transition:.16s; }
  .rvbtn{ color:var(--ink); background:var(--surface-2); border:1px solid var(--line-gold); }
  .rvbtn:hover{ border-color:var(--gold); background:var(--surface); transform:translateY(-1px); }
  .prbtn{ color:var(--ink-70); background:transparent; border:1px solid var(--line); }
  .prbtn:hover{ color:var(--ink); border-color:var(--line-gold); background:var(--surface-2); transform:translateY(-1px); }
  .rvbtn:active,.prbtn:active{ transform:translateY(0); }
  .rvbtn svg,.prbtn svg{ width:16px; height:16px; }
  .ank__sheet{ text-decoration:none; }
  .ank__sheet svg{ color:#129d5f; }   /* Sheets yashili */
  .ank__row{ font-family:'Manrope',sans-serif; font-weight:700; font-size:.8rem; color:var(--ink-50); text-decoration:none; white-space:nowrap; transition:.16s; }
  a.ank__row:hover{ color:var(--gold-hi); }
  .ank__toggle svg{ transition:transform .3s var(--e-quint); }
  .ank__toggle.is-open svg{ transform:rotate(180deg); }

  /* ---------- baholash oynasi ---------- */
  .rev{ border:0; padding:0; background:transparent; width:min(94vw,640px); max-height:calc(100dvh - 40px); color:var(--ink); overflow:visible; }
  .rev::backdrop{ background:rgba(3,8,12,.66); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .rev[open]{ animation:revIn .28s var(--e-quint) both; }
  @keyframes revIn{ from{ opacity:0; transform:translateY(14px) scale(.985); } to{ opacity:1; transform:none; } }
  .rev__card{ background:linear-gradient(180deg,var(--surface),var(--bg-2)); border:1px solid var(--line-gold);
    border-radius:22px; padding:24px 24px 20px; box-shadow:0 44px 110px -46px rgba(0,0,0,.92);
    display:flex; flex-direction:column; gap:15px; max-height:calc(100dvh - 40px); overflow:auto; }
  .rev__head{ display:flex; align-items:flex-start; gap:14px; }
  .rev__name{ margin:0; font-family:'Manrope',sans-serif; font-weight:700; font-size:1.4rem; letter-spacing:-.02em; line-height:1.16; }
  .rev__sub{ margin:4px 0 0; color:var(--ink-50); font-size:.9rem; font-weight:600; }
  .rev__x{ margin-left:auto; flex:0 0 auto; width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
    border:1px solid var(--line); background:transparent; color:var(--ink-70); cursor:pointer; transition:.16s; }
  .rev__x:hover{ border-color:var(--gold); color:var(--ink); background:var(--surface); }
  .rev__x svg{ width:17px; height:17px; }
  .rev__label{ font-family:'Manrope',sans-serif; font-weight:700; font-size:.92rem; color:var(--ink); }
  .rev__photo{ display:flex; gap:14px; align-items:center; padding-top:14px; border-top:1px solid var(--line); }
  .rev__photo-box{ width:64px; height:80px; flex:0 0 auto; border-radius:10px; overflow:hidden; background:var(--bg);
    border:1px solid var(--line); display:grid; place-items:center; }
  .rev__photo-box img{ width:100%; height:100%; object-fit:cover; }
  .rev__photo-box svg{ width:22px; height:22px; color:var(--ink-34); }
  .rev__photo-side{ display:flex; flex-direction:column; gap:6px; min-width:0; align-items:flex-start; }
  .rev__photo-hint{ margin:0; color:var(--ink-50); font-size:.82rem; line-height:1.45; }
  .rev__ta{ width:100%; min-height:220px; max-height:46vh; resize:vertical; font:inherit; font-size:1.04rem; line-height:1.62;
    color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:14px 16px; transition:.18s; }
  .rev__ta::placeholder{ color:var(--ink-34); }
  .rev__ta:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }
  /* baho: oddiy matn, tanlangani tagida chiziq — doira ham, toʻldirish ham yoʻq */
  .rev__colors{ display:flex; flex-direction:column; gap:4px; }
  .swatches{ display:flex; gap:4px; flex-wrap:wrap; }
  .sw{ appearance:none; cursor:pointer; border:0; background:transparent; color:var(--ink-50); position:relative;
    padding:0 9px; height:38px; font:inherit; font-family:'Manrope',sans-serif; font-weight:700; font-size:.92rem; transition:.16s;
    -webkit-tap-highlight-color:transparent; }
  .sw:hover{ color:var(--ink); }
  .sw.is-on{ color:var(--ink); }
  .sw.is-on::after{ content:""; position:absolute; left:9px; right:9px; bottom:5px; height:2px; border-radius:2px; background:var(--gold); }
  .sw--green,.sw--green:hover,.sw--green.is-on{ color:var(--st-green); } .sw--green.is-on::after{ background:var(--st-green); }
  .sw--yellow,.sw--yellow:hover,.sw--yellow.is-on{ color:var(--st-yellow); } .sw--yellow.is-on::after{ background:var(--st-yellow); }
  .sw--red,.sw--red:hover,.sw--red.is-on{ color:var(--st-red); } .sw--red.is-on::after{ background:var(--st-red); }
  .rev__actions{ display:flex; gap:10px; margin-top:4px; }
  .rev__save{ min-width:160px; }
  .rev__err{ color:#e0466f; min-height:1em; font-size:.88rem; }

  /* ---------- holatlar / kirish ---------- */
  .state{ text-align:center; padding:80px 20px; color:var(--ink-70); }
  .state h3{ font-family:'Manrope',sans-serif; color:var(--ink); margin:0 0 8px; letter-spacing:-.02em; }
  .spin{ width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--gold);
    border-radius:50%; margin:0 auto 18px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .login{ min-height:100vh; display:grid; place-items:center; padding:24px; position:relative; }
  .login__tgl{ position:absolute; top:18px; right:18px; display:flex; gap:8px; }
  .login__card{ width:100%; max-width:390px; background:linear-gradient(180deg,var(--surface),var(--bg-2));
    border:1px solid var(--line-gold); border-radius:var(--r-card); padding:34px 28px; text-align:center;
    box-shadow:0 26px 60px -30px rgba(0,0,0,.85); animation:acIn .5s var(--e-quint) both; }
  .login__card img{ height:54px; margin:0 auto 16px; display:block; }
  .login__card h1{ font-family:'Manrope',sans-serif; font-weight:700; font-size:1.35rem; margin:0 0 6px; letter-spacing:-.02em; }
  .login__card p{ color:var(--ink-70); font-size:.9rem; margin:0 0 22px; }
  .login__card input{ width:100%; padding:14px 16px; font:inherit; color:var(--ink); text-align:center; letter-spacing:.05em;
    background:var(--bg); border:1px solid var(--line); border-radius:var(--r-input); margin-bottom:14px; }
  .login__card input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }
  .err{ color:#e0466f; font-size:.86rem; margin-top:12px; min-height:1em; }

  ::selection{ background:var(--gold); color:#0a0a0a; }
  [hidden]{ display:none!important; }

  /* ---------- koʻrinish yorliqlari ---------- */
  .vtabs{ display:flex; gap:2px; }
  .vtab{ appearance:none; border:0; background:transparent; color:var(--ink-50); cursor:pointer; white-space:nowrap; position:relative;
    font-family:'Manrope',sans-serif; font-weight:700; font-size:.94rem; letter-spacing:-.01em; padding:10px 12px; transition:.16s; }
  .vtab:hover{ color:var(--ink); }

  /* ---------- statistika ---------- */

  .bars{ display:flex; flex-direction:column; gap:13px; }

  .bar__lbl{ color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar__track{ height:14px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .bar__fill{ display:block; height:100%; border-radius:4px; min-width:4px; animation:barGrow .6s var(--e-quint) both; transform-origin:left; }
  @keyframes barGrow{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
  .bar__val{ color:var(--ink); font-weight:800; font-family:'Manrope',sans-serif; text-align:right; }

  .vbars{ display:flex; align-items:flex-end; gap:12px; height:158px; }

  .vbar__col{ width:100%; max-width:46px; border-radius:8px 8px 0 0; min-height:4px; animation:barRise .6s var(--e-quint) both; transform-origin:bottom; }
  @keyframes barRise{ from{ transform:scaleY(0); } to{ transform:scaleY(1); } }
  .vbar__v{ font-family:'Manrope',sans-serif; font-weight:700; font-size:.92rem; color:var(--ink); }
  .vbar__l{ font-size:.82rem; color:var(--ink-50); }

  .area{ width:100%; height:180px; display:block; }

  @media (max-width:640px){ .vtabs{ order:6; flex-basis:100%; } .kpi__n{ font-size:2.1rem; } .bar{ grid-template-columns:82px 1fr auto 36px; gap:9px; } }

  /* ---------- tahrirlash ---------- */

<script>
  var ENDPOINT = "https://script.google.com/macros/s/AKfycby7z5nB-DfFxk6tBGVCFkMQNpPCdNbHI9DSURAMYiUt8GKPasqRNULcyG-A3lZzZzEIwQ/exec";
  /* Google Sheets havolasi ("Applications" varagʻi) — ishtirokchi qatoriga
       toʻgʻridan-toʻgʻri oʻtish uchun. Backend roʻyxat bilan sheetUrl/gid qaytarsa,
       ular shu qiymatlarni avtomatik almashtiradi. */
  var SHEET_URL = "https://docs.google.com/spreadsheets/d/1y9zi8SMU7ppr_bxAH6d6Pb5Sp4WFqiock8_3iy7JkBE/edit";
  var SHEET_GID = "1303875505";
  function sheetLink(row){
    var base=(state.sheetUrl||SHEET_URL||"").replace(/[#?].*$/,""), gid=(state.gid||SHEET_GID||"");
    if(!base||!row) return "";
    return base + "#gid=" + encodeURIComponent(gid) + "&range=A" + row;
  }
  var KEY_STORE="upop_admin_key", LANG_STORE="upop_admin_lang", THEME_STORE="upop_admin_theme", ROWS_STORE="upop_admin_rows";
  /* Doimiy saqlash: admin kirishi brauzer qayta ochilganda ham esda qoladi
       (localStorage), maxfiy rejimda sessionStorage ga oʻtadi. Qatorlar keshi
       panelni darhol ochadi (avval kesh, keyin yangilanish), sekin backend
       kutilmaydi. Qurilmada bolalar maʼlumoti turadi — "Chiqish" uni tozalaydi. */
  var PS; try{ localStorage.setItem("__upop_t","1"); localStorage.removeItem("__upop_t"); PS=localStorage; }catch(e){ PS=sessionStorage; }
  function writeCache(){ try{ PS.setItem(ROWS_STORE, JSON.stringify(state.rows)); }catch(e){} }
  function readCache(){ try{ var s=PS.getItem(ROWS_STORE); if(!s) return null; var a=JSON.parse(s); return Array.isArray(a)?a:null; }catch(e){ return null; } }
  function clearCache(){ try{ PS.removeItem(ROWS_STORE); }catch(e){} }

  /* Apps Script qayta joylangandan yoki sovuq startdan keyingi birinchi soʻrovda
       JSON oʻrniga HTML sahifa qaytarishi mumkin. Shuning uchun matn sifatida oʻqib,
       bir necha marta qayta urinamiz — kirish "Unexpected token '<'" bilan qulamasin. */
  function fetchJSON(url, base, tries){
    if(tries==null) tries=3;
    var ac=(typeof AbortController!=="undefined")?new AbortController():null;
    var to=ac?setTimeout(function(){ try{ ac.abort(); }catch(e){} },15000):null;
    var opt={}; for(var k in base) opt[k]=base[k];
    if(ac) opt.signal=ac.signal;
    return fetch(url,opt)
      .then(function(r){ return r.text(); })
      .then(function(t){ if(to) clearTimeout(to);
        try{ return JSON.parse(t); }
        catch(e){
          // Sovuq start HTML qaytardi — qisqa kutib qayta urinamiz (300/600/1200 ms).
          if(tries>0 && /^\s*</.test(t)){ var d=300*Math.pow(2,3-tries);
            return new Promise(function(res){ setTimeout(res,d); }).then(function(){ return fetchJSON(url, base, tries-1); }); }
          throw new Error("badjson");
        }
      })
      .catch(function(err){ if(to) clearTimeout(to);
        if(err && err.name==="AbortError" && tries>0) return fetchJSON(url, base, tries-1);
        throw err;
      });
  }
  function api(payload, tries){
    return fetchJSON(ENDPOINT, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), redirect:"follow" }, tries);
  }
  function apiGet(query, tries){
    return fetchJSON(ENDPOINT+"?"+query, { method:"GET", redirect:"follow", cache:"no-store" }, tries);
  }

  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve,reject){
      var url=URL.createObjectURL(file), im=new Image();
      im.onload=function(){ URL.revokeObjectURL(url);
        var s=Math.min(1, maxDim/Math.max(im.naturalWidth, im.naturalHeight));
        var w=Math.max(1,Math.round(im.naturalWidth*s)), h=Math.max(1,Math.round(im.naturalHeight*s));
        var c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(im,0,0,w,h);
        try{ resolve(c.toDataURL("image/jpeg", quality)); }catch(e){ reject(e); } };
      im.onerror=reject; im.src=url; });
  }

  function fmtLongDate(v){ var t=String(v==null?"":v).trim(); if(!t) return t; var d,mo,y,m;
    if((m=t.match(/^(\d{4})-(\d{2})-(\d{2})/))){ y=+m[1]; mo=+m[2]; d=+m[3]; }
    else if((m=t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/))){ d=+m[1]; mo=+m[2]; y=+m[3]; }
    else return t;
    if(!(mo>=1&&mo<=12&&d>=1&&d<=31)) return t;

    // Yashirin iframe orqali chop etamiz — boʻsh ("about:blank") varaq ochilmaydi.

  /* ---- baholash oynasi: surat + tarix + rang birga saqlanadi ---- */
  function autogrow(ta){ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight+2, Math.round(window.innerHeight*0.42))+"px"; }
  function setSwatch(s){ rev.status=s||""; $("revSwatches").querySelectorAll(".sw").forEach(function(b){ b.classList.toggle("is-on",(b.getAttribute("data-s")||"")===rev.status); });

  function openReview(id){
    var row=rowById(id); if(!row) return; rev.id=id; rev.photo=null;
    $("revName").textContent=row.fullname||"—";
    $("revSub").textContent=[row.phone,row.region].filter(Boolean).join(", ");

    $("revPhotoBtn").textContent=(row.photo && String(row.photo).trim())?tr().photo_replace:tr().photo_add;
    $("revPhotoInput").value="";

  $("revSwatches").addEventListener("click", function(e){ var b=e.target.closest(".sw"); if(!b) return; e.preventDefault(); setSwatch(b.getAttribute("data-s")||""); });
  $("revPhotoInput").addEventListener("change", function(){
    var f=this.files && this.files[0]; if(!f) return;
    compressImage(f, 1000, 0.82).then(function(url){ rev.photo=url; setRevPhoto(url); $("revPhotoBtn").textContent=tr().photo_replace; }).catch(function(){});
  });
  $("revX").addEventListener("click", closeReview);
  $("revCancel").addEventListener("click", closeReview);

  $("revSave").addEventListener("click", function(){
    var id=rev.id; if(!id) return;
    var hist=$("revTa").value, status=rev.status||"", photo=rev.photo;
    var row=rowById(id); if(!row){ closeReview(); return; }
    // Optimistik saqlash: oʻzgarishni DARHOL qoʻllab oynani yopamiz, server bilan fonda sinxronlaymiz.
    var prev={ status:row.status, history:row.history, reviewed:row.reviewed, photo:row.photo };
    row.status=status; row.history=hist; row.reviewed=(status!=="");
    if(photo) row.photo=photo;                 // yangi suratni darhol koʻrsatamiz (mahalliy)
    writeCache(); closeReview(); buildFilters(); render(false);
    function rerender(){ if($("rev")&&$("rev").open) return; buildFilters(); if(state.view==="stats") renderStats(); else render(false); }
    var payload={ action:"review", key:state.key, submissionId:id, status:status, history:hist };
    if(photo){ payload.photo=photo; payload.photoType="image/jpeg"; }
    api(payload).then(function(res){
      if(!res||res.ok!==true) throw new Error((res&&res.error)||"error");
      var r2=rowById(id);                       // server bilan solishtiramiz (haqiqiy Drive havolasi va h.k.)
      if(r2){ r2.status=res.status||""; r2.history=(res.history!=null?res.history:hist); r2.reviewed=(r2.status!=="");
        if(res.photo) r2.photo=res.photo; }
      writeCache(); rerender();
    }).catch(function(){
      var r2=rowById(id);                       // sinxronlash oʻtmadi — oʻzgarishni qaytaramiz
      if(r2){ r2.status=prev.status; r2.history=prev.history; r2.reviewed=prev.reviewed; r2.photo=prev.photo; }
      writeCache(); rerender();
      alert(tr().savefail);
    });
  });

  function kpiTile(n,l,color){ return '<div class="kpi" style="--kc:'+color+'"><span class="kpi__n">'+n+'</span><span class="kpi__l">'+esc(l)+'</span></div>'; }
  function panel(title,body,mod,note){ return '<div class="panel'+(mod?' panel--'+mod:'')+'"><p class="panel__h">'+esc(title)+'</p>'+body+(note?'<p class="panel__note">'+esc(note)+'</p>':'')+'</div>'; }

  /* Registr va imlo xatolarini birlashtiramiz: "Maqom"=="maqom", "ashulla"=="ashula" —
       kichik harf, trim, soʻng kichik farq ichida eng yaqin maʼlum janrga keltiramiz. */
  function lc(s){ return String(s==null?'':s).toLowerCase().trim().replace(/[.,;!]+$/,'').replace(/\s+/g,' '); }
  function titleCase(s){ return s.replace(/(^|\s)\S/g,function(c){return c.toUpperCase();}); }
  function lev(a,b){ var m=a.length,n=b.length,i,j,dp=[]; for(i=0;i<=m;i++){dp[i]=[i];} for(j=0;j<=n;j++){dp[0][j]=j;}
    for(i=1;i<=m;i++){ for(j=1;j<=n;j++){ dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1)); } } return dp[m][n]; }
  var GENRES=["Maqom","Ashula","Katta ashula","Lapar","Yalla","Suvora","Baxshi","Doston","Terma","Alla","Yor-yor"];
  function canonGenre(raw){ var s=lc(raw); if(!s) return null; var best=null,bd=99;
    for(var i=0;i<GENRES.length;i++){ var g=GENRES[i].toLowerCase(); if(g===s) return {key:g,label:GENRES[i].toUpperCase()}; var d=lev(s,g); if(d<bd){bd=d;best=GENRES[i];} }
    var thr=s.length>=6?2:1; if(best&&bd<=thr) return {key:best.toLowerCase(),label:best.toUpperCase()}; return {key:s,label:s.toUpperCase()}; }
  /* Erkin yozilgan shaharlarni haqiqiy viloyatlarga keltiramiz: "Toshkent shahri Olmazor
       tumani", "Toshkent Shahri", "Toshkent" → bitta "Toshkent". Soʻz boʻyicha moslashtiriladi. */
  var REGIONS=[
    {t:["toshkent","tashkent","ташкент","тошкент"],l:"Toshkent"},{t:["andijon","andijan","андижон","андижан"],l:"Andijon"},
    {t:["buxoro","buxara","бухоро","бухар"],l:"Buxoro"},{t:["farg","fergan","фарг","ферган"],l:"Fargʻona"},
    {t:["jizzax","jizzakh","жиззах","джизак"],l:"Jizzax"},{t:["xorazm","urganch","хоразм","хорезм"],l:"Xorazm"},
    {t:["namangan","наманган"],l:"Namangan"},{t:["navoiy","navoi","навоий","навои"],l:"Navoiy"},
    {t:["qashqadaryo","qarshi","кашкадар","қашқадар","қарши"],l:"Qashqadaryo"},{t:["qoraqalpog","nukus","коракалпог","каракалпак","нукус"],l:"Qoraqalpogʻiston"},
    {t:["samarqand","самарканд","самарқанд"],l:"Samarqand"},{t:["sirdaryo","сирдар","сырдар"],l:"Sirdaryo"},
    {t:["surxondaryo","termiz","сурхондар","сурхандар","термиз"],l:"Surxondaryo"}
  ];
  function canonRegion(raw){ var s=lc(raw); if(!s) return null;
    if(s.indexOf("toshkent")>=0||s.indexOf("tashkent")>=0||s.indexOf("ташкент")>=0||s.indexOf("тошкент")>=0){
      var vil=(s.indexOf("viloyat")>=0||s.indexOf("область")>=0||s.indexOf("вилоят")>=0);
      return vil?{key:"toshkent viloyati",label:"Toshkent viloyati"}:{key:"toshkent shahri",label:"Toshkent shahri"};
    }
    for(var i=0;i<REGIONS.length;i++){ for(var j=0;j<REGIONS[i].t.length;j++){ if(s.indexOf(REGIONS[i].t[j])>=0) return {key:REGIONS[i].l.toLowerCase(),label:REGIONS[i].l}; } }
    return {key:s,label:titleCase(s)}; }
  function canonPlain(raw){ var s=lc(raw); if(!s) return null; return {key:s,label:titleCase(s)}; }
  function canonUp(raw){ var s=lc(raw); if(!s) return null; return {key:s,label:s.toUpperCase()}; }
  function tally(rows,valFn,canonFn,n){ var m={},lab={};
    rows.forEach(function(r){ var c=canonFn(valFn(r)); if(!c) return; if(!(c.key in m)){m[c.key]=0;lab[c.key]=c.label;} m[c.key]++; });
    var arr=Object.keys(m).map(function(k){return {label:lab[k],value:m[k]};}).sort(function(a,b){return b.value-a.value;});
    return { items:arr.slice(0,n), distinct:arr.length, top:arr[0]||null }; }
  function fmtDay(k){ var p=String(k).split('-'); return p.length===3?p[2]+'.'+p[1]:String(k); }

  function donut(segs){
    var total=segs.reduce(function(a,s){return a+s.value;},0)||1, r=46, c=2*Math.PI*r, off=0;
    var arcs=segs.filter(function(s){return s.value>0;}).map(function(s){
      var len=c*s.value/total, seg=Math.max(0,len-4);
      var el='<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="14" stroke-dasharray="'+seg.toFixed(2)+' '+(c-seg).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)" stroke-linecap="round"/>';
      off+=len; return el; }).join("");
    return '<svg viewBox="0 0 120 120" class="donut"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="14"/>'+arcs+'<text x="60" y="66" text-anchor="middle" class="donut__num">'+total+'</text></svg>'; }
  function donutPanel(segs){
    var total=segs.reduce(function(a,s){return a+s.value;},0)||1;
    return '<div class="donutwrap">'+donut(segs)+'<div class="legend">'+segs.map(function(s){
      var p=Math.round(s.value/total*100);
      return '<div class="legend__i"><span class="legend__d" style="background:'+s.color+'"></span><span class="legend__t">'+esc(s.label)+'</span><b class="legend__v">'+s.value+'</b><span class="legend__p">'+p+'%</span></div>';
    }).join("")+'</div></div>'; }
  function hbars(items,base){ if(!items.length) return '<div class="empty">'+esc(tr().st_empty)+'</div>';
    base=base||items.reduce(function(a,i){return a+i.value;},0)||1;
    var max=Math.max.apply(null,items.map(function(i){return i.value;}).concat([1]));
    return '<div class="bars">'+items.map(function(it,i){ var w=Math.round(it.value/max*100), p=Math.round(it.value/base*100);
      return '<div class="bar"><span class="bar__lbl" title="'+esc(it.label)+'">'+esc(it.label)+'</span><span class="bar__track"><span class="bar__fill" style="width:'+w+'%;background:'+PAL[i%PAL.length]+'"></span></span><b class="bar__val">'+it.value+'</b><span class="bar__pct">'+p+'%</span></div>';
    }).join("")+'</div>'; }
  function vbars(items){ var max=Math.max.apply(null,items.map(function(i){return i.value;}).concat([1]));
    return '<div class="vbars">'+items.map(function(it,i){ var hp=Math.round(it.value/max*100);
      return '<div class="vbar"><b class="vbar__v">'+it.value+'</b><span class="vbar__col" style="height:'+hp+'%;background:'+PAL[i%PAL.length]+'"></span><span class="vbar__l">'+esc(it.label)+'</span></div>';
    }).join("")+'</div>'; }
  function byDay(rows){ var m={}; rows.forEach(function(r){ if(!r.submittedAt) return; var d=new Date(r.submittedAt); if(isNaN(d)) return;
    var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); m[k]=(m[k]||0)+1; });
    return Object.keys(m).sort().map(function(k){return {label:k,value:m[k]};}); }
  function areaChart(pts){ if(!pts.length) return '<div class="empty">'+esc(tr().st_empty)+'</div>';
    var w=640,h=180,padX=6,baseY=h-26,topY=14, n=pts.length;
    var max=Math.max.apply(null,pts.map(function(p){return p.value;}).concat([1]));
    var X=function(i){ return padX+(n<=1?(w-2*padX)/2:(i/(n-1))*(w-2*padX)); };
    var Y=function(v){ return baseY-(v/max)*(baseY-topY); };
    var d=pts.map(function(p,i){ return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.value).toFixed(1); }).join(' ');
    var ar=d+' L'+X(n-1).toFixed(1)+' '+baseY+' L'+X(0).toFixed(1)+' '+baseY+' Z';
    function fmt(k){ var p=k.split('-'); return p[2]+'.'+p[1]; }
    var lbls = n<=1 ? '<span>'+fmt(pts[0].label)+'</span>'
      : '<span>'+fmt(pts[0].label)+'</span><span>'+fmt(pts[Math.floor(n/2)].label)+'</span><span>'+fmt(pts[n-1].label)+'</span>';

  var ED_LANGS=["uz","oz","ru","en"];

  function edBase(k,l){ var s=edSaved(k,l); return l==="oz" ? s : (s||edDef(k,l)); }
  function edVal(k,l){ return edHas(ed.e[k],l) ? ed.e[k][l] : edBase(k,l); }

  function edCollect(){ var items={}, n=0;
    Object.keys(ed.e).forEach(function(k){ Object.keys(ed.e[k]).forEach(function(l){
      if(edDirty(k,l)){ (items[k]=items[k]||{})[l]=edNorm(k,l,edVal(k,l)); n++; } }); });

  function edSet(k,l,v){ var e=ed.e[k]||(ed.e[k]={});

  /* Maydon balandligi matnga moslanadi: avval hammasiga yozamiz, keyin oʻqiymiz —

       oʻlchanadi (faol maydon bundan mustasno — uning bekor qilish tarixi buzilmasin). */
  function edGrow(list){
    var tas=[], ph=[], h=[], i, y=window.pageYOffset;
    for(i=0;i<list.length;i++){ if(list[i] && list[i].offsetParent!==null) tas.push(list[i]); }
    for(i=0;i<tas.length;i++){ var t=tas[i];
      ph[i]=!t.value && !!t.placeholder && t!==document.activeElement;
      if(ph[i]) t.value=t.placeholder;
      t.style.height="auto"; }
    for(i=0;i<tas.length;i++) h[i]=tas[i].scrollHeight;
    for(i=0;i<tas.length;i++){ if(ph[i]) tas[i].value=""; tas[i].style.height=(h[i]+2)+"px"; }
    if(tas.length && window.pageYOffset!==y) window.scrollTo(0,y);

  // skriptni bir marta yuklaydi; xato boʻlsa tegni olib tashlaydi — qayta urinish mumkin
  function edScript(src, ready){
    return new Promise(function(res,rej){

      function drop(){ if(s.parentNode) s.parentNode.removeChild(s); rej(new Error(src)); }

      s.onerror=drop;
      document.head.appendChild(s);

      .then(function(){ return edScript("/js/content.js", function(){ return !!window.UPOP_CONTENT; }); })
      .then(function(){ return true; }, function(){ return false; });

      var r=a[1];

    }
    $("login").hidden=true;
    document.body.insertAdjacentHTML("afterbegin",'<div class="state" id="boot"><div class="spin"></div>'+esc(tr().loading)+'</div>');
    loadList(key).then(function(){ var b=$("boot"); if(b) b.remove(); showApp(); })
      .catch(function(){ var b=$("boot"); if(b) b.remove(); $("login").hidden=false; });
  })();
</script>
</body>
