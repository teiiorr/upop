<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>UPOP — Заявки</title>
<link rel="icon" href="/logo-nav.webp" type="image/webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
<!-- reuse the website's own design system (tokens, buttons, fonts, colours) -->
<link rel="stylesheet" href="/css/styles.css" />
<style>
  body{ background:var(--bg); min-height:100vh; transition:background .3s ease;
    --st-green:#3fbf6f; --st-yellow:#e6b93e; --st-red:#e56464;
    --tline:rgba(242,228,198,.20); }   /* visible table gridlines */
  a{ color:inherit; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 clamp(16px,4vw,40px); }

  /* ---------- top bar ---------- */
  .abar{ position:sticky; top:0; z-index:20; background:rgba(5,12,17,.82);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line-gold); }
  .abar__in{ display:flex; align-items:center; gap:12px; padding:14px 0; }
  .abar__brand{ display:flex; align-items:center; gap:11px; font-family:var(--font-disp); font-weight:700; font-size:1.1rem; letter-spacing:-.02em; }
  .abar__brand img{ height:30px; width:auto; display:block; }
  .abar__sp{ flex:1; }
  .cnt{ font-size:.9rem; color:var(--ink-70); white-space:nowrap; }
  .cnt b{ color:var(--gold-hi); font-family:var(--font-disp); font-weight:600; }
  .iconbtn,.tgl{ appearance:none; border:1px solid var(--line-gold); background:var(--surface); color:var(--ink);
    border-radius:11px; padding:0; width:42px; height:42px; display:inline-grid; place-items:center; cursor:pointer; transition:.16s; }
  .iconbtn:hover,.tgl:hover{ border-color:var(--gold); background:var(--surface-2); }
  .iconbtn svg,.tgl svg{ width:18px; height:18px; display:block; }
  .tgl{ font:inherit; font-weight:700; font-size:.84rem; font-family:var(--font-disp); }
  .ghost{ appearance:none; border:1px solid var(--line-gold); background:var(--surface); color:var(--ink);
    border-radius:11px; padding:0 16px; height:42px; font:inherit; font-size:.86rem; font-weight:700; cursor:pointer; transition:.16s;
    font-family:var(--font-disp); letter-spacing:-.01em; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .ghost:hover{ border-color:var(--gold); background:var(--surface-2); }

  /* ---------- tools / filters ---------- */
  .tools{ display:flex; flex-wrap:wrap; gap:12px; padding:24px 0 6px; align-items:center; }
  .srch{ position:relative; flex:1 1 280px; min-width:190px; }
  .srch svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.5; pointer-events:none; }
  .srch input{ width:100%; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-input); padding:13px 15px 13px 42px; transition:.2s; }
  .srch input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }

  .segf{ display:flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:5px; overflow-x:auto; scrollbar-width:none; max-width:100%; }
  .segf::-webkit-scrollbar{ display:none; }
  .segf__b{ appearance:none; border:0; background:transparent; color:var(--ink-70); cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:10px; transition:.16s;
    font-family:var(--font-disp); font-weight:600; font-size:.82rem; letter-spacing:-.01em; }
  .segf__b:hover{ color:var(--ink); background:var(--surface-2); }
  .segf__b.is-on{ color:var(--ink); background:var(--surface-2); box-shadow:inset 0 0 0 1.5px var(--line-gold); }
  .segf__dot{ width:11px; height:11px; border-radius:50%; flex:0 0 auto; }
  .segf__dot--green{ background:var(--st-green); } .segf__dot--yellow{ background:var(--st-yellow); } .segf__dot--red{ background:var(--st-red); }

  .sel{ position:relative; }
  .sel select{ font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:13px 40px 13px 15px; appearance:none; font-weight:700; cursor:pointer; max-width:220px;
    font-family:var(--font-disp); font-size:.84rem; letter-spacing:-.01em; }
  .sel select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }
  .sel::after{ content:""; position:absolute; right:16px; top:50%; width:7px; height:7px; pointer-events:none;
    border-right:2px solid var(--ink-70); border-bottom:2px solid var(--ink-70); transform:translateY(-70%) rotate(45deg); }

  /* ---------- candidate anketa card ---------- */
  .grid{ display:flex; flex-direction:column; align-items:center; gap:26px; padding:24px 0 96px; }
  .grid.no-anim .anketa{ animation:none; }
  .anketa{ width:100%; max-width:1060px; background:var(--surface); border:1px solid var(--line); border-radius:22px;
    padding:28px 30px; box-shadow:0 24px 60px -36px rgba(0,0,0,.85);
    transition:border-color .2s, transform .2s var(--e-quint), box-shadow .2s; animation:acIn .55s var(--e-quint) both; }
  @keyframes acIn{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }
  .anketa:hover{ border-color:var(--line-gold); transform:translateY(-2px); box-shadow:0 34px 74px -38px rgba(0,0,0,.95); }
  .anketa[data-status="green"]{ border-color:color-mix(in srgb, var(--st-green) 52%, var(--line)); }
  .anketa[data-status="yellow"]{ border-color:color-mix(in srgb, var(--st-yellow) 52%, var(--line)); }
  .anketa[data-status="red"]{ border-color:color-mix(in srgb, var(--st-red) 52%, var(--line)); }

  .ank__head{ display:flex; gap:24px; align-items:flex-start; padding-bottom:22px; border-bottom:1px solid var(--line); }
  .ank__photo{ width:112px; height:140px; flex:0 0 auto; border-radius:14px; overflow:hidden; background:var(--surface-2);
    border:1px solid var(--line-gold); display:grid; place-items:center; }
  .ank__photo img{ width:100%; height:100%; object-fit:cover; }
  .ank__photo-ph{ display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--ink-34);
    font-family:var(--font-disp); font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; text-align:center; padding:8px; }
  .ank__photo-ph svg{ width:30px; height:30px; opacity:.7; }
  .ank__ident{ flex:1 1 auto; min-width:0; padding-top:5px; }
  .ank__name{ font-family:var(--font-disp); font-weight:700; font-size:1.48rem; letter-spacing:-.02em; line-height:1.05; margin:0 0 12px; }
  .ank__meta{ display:flex; flex-wrap:wrap; align-items:baseline; font-family:'Manrope',sans-serif; font-weight:600;
    font-size:.94rem; color:var(--ink-70); margin-bottom:14px; }
  .ank__meta span{ color:var(--ink); } .ank__meta span + span::before{ content:"·"; color:var(--ink-34); margin:0 9px; }
  .ank__contact{ display:flex; flex-direction:column; gap:12px; }
  .ank__lines{ display:flex; flex-wrap:wrap; gap:9px 24px; }
  .ank__ci{ display:inline-flex; align-items:center; gap:8px; color:var(--ink); font-weight:600; font-size:1rem; text-decoration:none; }
  .ank__ci svg{ width:16px; height:16px; color:var(--gold); flex:0 0 auto; }
  .ank__ci:hover{ color:var(--gold-hi); }
  .ank__socs{ display:flex; gap:9px; }
  .ank__soc{ width:36px; height:36px; border-radius:10px; display:grid; place-items:center; color:var(--ink-70);
    border:1px solid var(--line-gold); transition:.16s; }
  .ank__soc:hover{ border-color:var(--gold); color:var(--gold-hi); background:var(--surface-2); transform:translateY(-1px); }
  .ank__soc svg{ width:18px; height:18px; }
  .ank__head-end{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; flex:0 0 auto; }
  .ank__date{ font-size:.82rem; color:var(--ink-50); white-space:nowrap; }
  .ank__dot{ width:16px; height:16px; border-radius:50%; border:2px solid var(--line); }
  .anketa[data-status="green"] .ank__dot{ background:var(--st-green); border-color:var(--st-green); box-shadow:0 0 0 4px rgba(63,191,111,.2); }
  .anketa[data-status="yellow"] .ank__dot{ background:var(--st-yellow); border-color:var(--st-yellow); box-shadow:0 0 0 4px rgba(230,185,62,.2); }
  .anketa[data-status="red"] .ank__dot{ background:var(--st-red); border-color:var(--st-red); box-shadow:0 0 0 4px rgba(229,100,100,.2); }

  /* collapsible details (built lazily on open) — smooth 0fr↔1fr reveal */
  .ank__reveal{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .34s var(--e-quint); }
  .ank__reveal.open{ grid-template-rows:1fr; }
  .ank__reveal-in{ overflow:hidden; min-height:0; }

  /* details as an even, bordered table (cells divided by hairlines), all Manrope */
  .ank__body{ margin-top:18px; border:1.5px solid var(--line-gold); border-radius:12px; overflow:hidden; background:var(--surface); }
  .ank__grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin:-1px 0 0 -1px; }
  .ank__cell{ border-top:1px solid var(--tline); border-left:1px solid var(--tline); padding:13px 16px; min-width:0; }
  .ank__cell--h{ grid-column:1 / -1; background:var(--surface-2); padding:11px 16px; border-top:1px solid var(--tline);
    font-family:'Manrope',sans-serif; font-weight:800; font-size:.74rem; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); }
  .ank__fk{ display:block; font-family:'Manrope',sans-serif; font-weight:700; font-size:.68rem; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-50); margin-bottom:4px; }
  .ank__fv{ display:block; font-family:'Manrope',sans-serif; color:var(--ink); font-size:1rem; line-height:1.45; word-break:break-word; }
  .ank__fv a{ color:var(--gold-hi); text-decoration:none; }
  .yes{ color:#4ec27f; font-weight:700; } .no{ color:var(--ink-34); }

  .ank__hist{ margin-top:8px; padding:17px 20px; background:var(--surface-2); border:1px solid var(--line); border-radius:16px; }
  .ank__hist h4{ margin:0 0 8px; font-family:var(--font-disp); font-weight:600; font-size:.68rem; letter-spacing:.13em; text-transform:uppercase; color:var(--gold); }
  .ank__hist p{ margin:0; white-space:pre-wrap; word-break:break-word; color:var(--ink); font-size:1.02rem; line-height:1.62; }

  .ank__foot{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:22px; padding-top:20px; border-top:1px solid var(--line); }
  .rvbtn,.prbtn{ appearance:none; font:inherit; font-family:var(--font-disp); font-weight:600; letter-spacing:-.01em; font-size:.9rem;
    display:inline-flex; align-items:center; gap:9px; padding:12px 18px; border-radius:12px; cursor:pointer; transition:.16s; }
  .rvbtn{ color:var(--ink); background:var(--surface-2); border:1px solid var(--line-gold); }
  .rvbtn:hover{ border-color:var(--gold); background:var(--surface); transform:translateY(-1px); }
  .prbtn{ color:var(--ink-70); background:transparent; border:1px solid var(--line); }
  .prbtn:hover{ color:var(--ink); border-color:var(--line-gold); background:var(--surface-2); transform:translateY(-1px); }
  .rvbtn:active,.prbtn:active{ transform:translateY(0); }
  .rvbtn svg,.prbtn svg{ width:16px; height:16px; }
  .ank__toggle svg{ transition:transform .3s var(--e-quint); }
  .ank__toggle.is-open svg{ transform:rotate(180deg); }

  /* ---------- review dialog ---------- */
  .rev{ border:0; padding:0; background:transparent; width:min(94vw,640px); max-height:calc(100dvh - 40px); color:var(--ink); overflow:visible; }
  .rev::backdrop{ background:rgba(3,8,12,.66); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  .rev[open]{ animation:revIn .28s var(--e-quint) both; }
  @keyframes revIn{ from{ opacity:0; transform:translateY(14px) scale(.985); } to{ opacity:1; transform:none; } }
  .rev__card{ background:linear-gradient(180deg,var(--surface),var(--bg-2)); border:1px solid var(--line-gold);
    border-radius:22px; padding:24px 24px 20px; box-shadow:0 44px 110px -46px rgba(0,0,0,.92);
    display:flex; flex-direction:column; gap:15px; max-height:calc(100dvh - 40px); overflow:auto; }
  .rev__head{ display:flex; align-items:flex-start; gap:14px; }
  .rev__name{ margin:0; font-family:var(--font-disp); font-weight:700; font-size:1.4rem; letter-spacing:-.02em; line-height:1.16; }
  .rev__sub{ margin:4px 0 0; color:var(--ink-50); font-size:.9rem; font-weight:600; }
  .rev__x{ margin-left:auto; flex:0 0 auto; width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
    border:1px solid var(--line); background:transparent; color:var(--ink-70); cursor:pointer; transition:.16s; }
  .rev__x:hover{ border-color:var(--gold); color:var(--ink); background:var(--surface); }
  .rev__x svg{ width:17px; height:17px; }
  .rev__label{ font-family:var(--font-disp); font-weight:600; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
  .rev__photo{ display:flex; gap:15px; align-items:center; }
  .rev__photo-box{ width:86px; height:108px; flex:0 0 auto; border-radius:12px; overflow:hidden; background:var(--bg);
    border:1px solid var(--line-gold); display:grid; place-items:center; }
  .rev__photo-box img{ width:100%; height:100%; object-fit:cover; }
  .rev__photo-box svg{ width:26px; height:26px; color:var(--ink-34); }
  .rev__photo-side{ display:flex; flex-direction:column; gap:8px; min-width:0; }
  .rev__photo-hint{ margin:0; color:var(--ink-50); font-size:.82rem; line-height:1.5; }
  .rev__ta{ width:100%; min-height:200px; max-height:44vh; resize:vertical; font:inherit; font-size:1.04rem; line-height:1.62;
    color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:15px 16px; transition:.18s; }
  .rev__ta::placeholder{ color:var(--ink-34); }
  .rev__ta:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }
  .rev__colors{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .swatches{ display:flex; gap:10px; }
  .sw{ width:40px; height:40px; border-radius:50%; cursor:pointer; border:2px solid; background:transparent; transition:.16s;
    display:grid; place-items:center; color:#08130f; -webkit-tap-highlight-color:transparent; }
  .sw svg{ width:19px; height:19px; opacity:0; transform:scale(.5); transition:.16s; }
  .sw.is-on svg{ opacity:1; transform:scale(1); }
  .sw:hover{ transform:scale(1.08); } .sw:active{ transform:scale(.94); }
  .sw--green{ border-color:var(--st-green); } .sw--green.is-on{ background:var(--st-green); }
  .sw--yellow{ border-color:var(--st-yellow); } .sw--yellow.is-on{ background:var(--st-yellow); }
  .sw--red{ border-color:var(--st-red); } .sw--red.is-on{ background:var(--st-red); }
  .sw--clear{ border-color:var(--line-gold); color:var(--ink-70); font-size:1.2rem; line-height:1; }
  .sw--clear.is-on{ background:var(--surface-2); box-shadow:inset 0 0 0 1.5px var(--gold); color:var(--ink); }
  .sw--clear::before{ content:"—"; }
  .rev__actions{ display:flex; gap:10px; margin-top:2px; }
  .rev__save{ min-width:150px; }
  .rev__err{ color:#e0466f; min-height:1em; font-size:.88rem; }

  /* ---------- states / login ---------- */
  .state{ text-align:center; padding:80px 20px; color:var(--ink-70); }
  .state h3{ font-family:var(--font-disp); color:var(--ink); margin:0 0 8px; letter-spacing:-.02em; }
  .spin{ width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--gold);
    border-radius:50%; margin:0 auto 18px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .login{ min-height:100vh; display:grid; place-items:center; padding:24px; position:relative; }
  .login__tgl{ position:absolute; top:18px; right:18px; display:flex; gap:8px; }
  .login__card{ width:100%; max-width:390px; background:linear-gradient(180deg,var(--surface),var(--bg-2));
    border:1px solid var(--line-gold); border-radius:var(--r-card); padding:34px 28px; text-align:center;
    box-shadow:0 26px 60px -30px rgba(0,0,0,.85); animation:acIn .5s var(--e-quint) both; }
  .login__card img{ height:54px; margin:0 auto 16px; display:block; }
  .login__card h1{ font-family:var(--font-disp); font-weight:700; font-size:1.35rem; margin:0 0 6px; letter-spacing:-.02em; }
  .login__card p{ color:var(--ink-70); font-size:.9rem; margin:0 0 22px; }
  .login__card input{ width:100%; padding:14px 16px; font:inherit; color:var(--ink); text-align:center; letter-spacing:.05em;
    background:var(--bg); border:1px solid var(--line); border-radius:var(--r-input); margin-bottom:14px; }
  .login__card input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(211,166,63,.14); }
  .err{ color:#e0466f; font-size:.86rem; margin-top:12px; min-height:1em; }

  ::selection{ background:var(--gold); color:#0a0a0a; }
  [hidden]{ display:none!important; }

  /* ================= LIGHT MODE ================= */
  html.light{
    --bg:#F4EFE3; --bg-2:#EBE3D3; --surface:#FFFFFF; --surface-2:#F7F1E6;
    --ink:#241A0C; --ink-70:rgba(36,26,12,.72); --ink-50:rgba(36,26,12,.52); --ink-34:rgba(36,26,12,.32);
    --line:rgba(36,26,12,.12); --line-gold:rgba(150,110,40,.42);
    --tline:rgba(36,26,12,.18);
  }
  html.light body{ background:var(--bg); }
  html.light .abar{ background:rgba(255,255,255,.86); }
  html.light .hl{ background:none; -webkit-text-fill-color:#8A5F1C; color:#8A5F1C; animation:none; }
  html.light .sel select option{ background:#fff; color:var(--ink); }
  html.light .anketa{ box-shadow:0 18px 44px -32px rgba(60,40,10,.34); }
  html.light .anketa:hover{ box-shadow:0 28px 58px -34px rgba(60,40,10,.4); }
  html.light .login__card,html.light .rev__card{ box-shadow:0 30px 70px -40px rgba(60,40,10,.4); }
  html.light .ank__contact a,html.light .ank__fv a{ color:#946a16; }
  html.light .cnt b,html.light .ank__grp h4,html.light .ank__hist h4,html.light .rev__label{ color:#8A5F1C; }
  html.light .rev::backdrop{ background:rgba(60,45,20,.4); }

  /* ================= RESPONSIVE ================= */
  @media (max-width:900px){ .ank__grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:640px){
    .abar__in{ flex-wrap:wrap; gap:9px 10px; padding:12px 0; }
    .abar__brand span{ display:none; }
    .cnt{ order:5; flex-basis:100%; }
    .iconbtn,.tgl,.ghost{ height:40px; } .iconbtn,.tgl{ width:40px; } .ghost{ padding:0 13px; font-size:.82rem; }
    .tools{ gap:10px; padding:16px 0 2px; }
    .srch{ flex-basis:100%; } .segf{ flex-basis:100%; } .sel{ flex:1 1 100%; } .sel select{ max-width:none; width:100%; }
    .grid{ gap:18px; padding:16px 0 72px; }
    .anketa{ padding:20px 18px; border-radius:18px; }
    .ank__head{ gap:16px; flex-wrap:wrap; }
    .ank__photo{ width:88px; height:110px; }
    .ank__name{ font-size:1.34rem; }
    .ank__head-end{ order:-1; flex-direction:row; align-items:center; width:100%; justify-content:space-between; }
    .ank__grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }   /* stays a table on phones */
    .ank__cell{ padding:9px 10px; } .ank__cell--h{ padding:8px 11px; font-size:.64rem; }
    .ank__fk{ font-size:.55rem; letter-spacing:.03em; margin-bottom:2px; }
    .ank__fv{ font-size:.84rem; line-height:1.35; }
    .ank__foot{ gap:10px; } .ank__foot .rvbtn,.ank__foot .prbtn{ flex:1 1 auto; justify-content:center; }
    .rev__card{ padding:20px 18px 16px; border-radius:18px; }
    .rev__actions{ flex-wrap:wrap; } .rev__actions .btn,.rev__actions .ghost{ flex:1 1 100%; }
  }
  @media (max-width:380px){ .anketa{ padding:17px 15px; } .ank__name{ font-size:1.2rem; } }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<section class="login" id="login">
  <div class="login__tgl">
    <button class="tgl" id="langBtn2">UZ</button>
    <button class="tgl" id="themeBtn2" aria-label="Theme"></button>
  </div>
  <div class="login__card">
    <img src="/logo-hero.png" alt="U POP TREND" />
    <h1 class="hl" id="l_title">Заявки</h1>
    <p id="l_sub">Введите пароль администратора</p>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" required />
      <button class="btn btn--pop btn--block" type="submit" id="loginBtn"><span class="btn__label" id="l_enter">Войти</span></button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</section>

<!-- ===== APP ===== -->
<div id="app" hidden>
  <header class="abar">
    <div class="wrap abar__in">
      <a class="abar__brand" href="/"><img src="/logo-hero.png" alt="" /> <span class="hl" id="a_title">Заявки</span></a>
      <div class="abar__sp"></div>
      <span class="cnt" id="count"></span>
      <button class="tgl" id="langBtn">UZ</button>
      <button class="tgl" id="themeBtn" aria-label="Theme"></button>

  /* The Apps Script web app occasionally returns an HTML warm-up/redirect page
     instead of JSON on the first call after a redeploy or a cold start. Read as
     text and retry a couple of times so sign-in never dies on "Unexpected token '<'". */
  function api(payload, tries){
    if(tries==null) tries=2;
    return fetch(ENDPOINT,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload), redirect:"follow" })
      .then(function(r){ return r.text(); })
      .then(function(t){
        try{ return JSON.parse(t); }
        catch(e){
          if(tries>0) return new Promise(function(res){ setTimeout(res,1000); }).then(function(){ return api(payload, tries-1); });
          throw new Error("badjson");
        }
      });
  }

  /* Downscale + re-encode a photo (admin upload) to a small JPEG data URL. */
  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve,reject){
      var url=URL.createObjectURL(file), im=new Image();
      im.onload=function(){ URL.revokeObjectURL(url);
        var s=Math.min(1, maxDim/Math.max(im.naturalWidth, im.naturalHeight));
        var w=Math.max(1,Math.round(im.naturalWidth*s)), h=Math.max(1,Math.round(im.naturalHeight*s));
        var c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(im,0,0,w,h);
        try{ resolve(c.toDataURL("image/jpeg", quality)); }catch(e){ reject(e); } };
      im.onerror=reject; im.src=url; });
  }

  }
  $("fStatus").addEventListener("click", function(e){
    var b=e.target.closest(".segf__b"); if(!b) return;
    state.fStatus=b.getAttribute("data-v")||"";
    $("fStatus").querySelectorAll(".segf__b").forEach(function(x){ x.classList.toggle("is-on", x===b); });
    render(false);
  });
  $("q").addEventListener("input",function(){render(false);});
  $("fGenre").addEventListener("change",function(){render(false);});

  function render(animate){
    var q=$("q").value.trim().toLowerCase(), st=state.fStatus, gn=$("fGenre").value, x=tr();
    var list=state.rows.filter(function(r){
      if(st==="no" && r.reviewed) return false;
      if(st==="any" && !r.reviewed) return false;
      if((st==="green"||st==="yellow"||st==="red") && r.status!==st) return false;
      if(gn && String(r.genre).trim()!==gn) return false;
      if(q){ var hay=[r.fullname,r.phone,r.region,r.piece,r.genre,r.email,r.instagram,r.tiktok,r.telegram,r.history]
        .map(function(z){return String(z==null?"":z).toLowerCase();}).join(" "); if(hay.indexOf(q)<0) return false; }
      return true;
    });
    var done=state.rows.filter(function(r){return r.reviewed;}).length;
    $("count").innerHTML=x.count(list.length,done,state.rows.length);
    if(!state.rows.length){ $("content").innerHTML='<div class="state"><h3>'+esc(x.empty_h)+'</h3><p>'+esc(x.empty_p)+'</p></div>'; return; }
    if(!list.length){ $("content").innerHTML='<div class="state"><h3>'+esc(x.none_h)+'</h3><p>'+esc(x.none_p)+'</p></div>'; return; }
    $("content").innerHTML='<div class="grid'+(animate?'':' no-anim')+'">'+list.map(function(r,i){return card(r,i);}).join("")+'</div>';
  }

  function L(k){ return tr().L[k]||k; }
  function dval(k,v){ if(v==null||v==="") return '<span class="no">—</span>';
    if(k==="submissionId") return esc(v);
    if(isBool(v)) return v==="Ha"?'<span class="yes">'+esc(tr().yes)+'</span>':'<span class="no">—</span>';
    if(k==="video"&&/^https?:/i.test(String(v))) return '<a href="'+esc(v)+'" target="_blank" rel="noopener">'+esc(v)+'</a>';
    return esc(v); }
  function socsInline(r){ var it=[["instagram","Instagram"],["tiktok","TikTok"],["telegram","Telegram"],["youtube","YouTube"]]
    .filter(function(s){return r[s[0]];})
    .map(function(s){ return '<a href="'+esc(socialUrl(s[0],r[s[0]]))+'" target="_blank" rel="noopener">'+s[1]+'</a>'; });
    return it.length? it.join(' · ') : ""; }
  function socsIcons(r){
    var map=[["instagram",ICN.ig],["telegram",ICN.tg],["tiktok",ICN.tiktok],["youtube",ICN.yt]];
    var it=map.filter(function(s){return r[s[0]];}).map(function(s){
      return '<a class="ank__soc" href="'+esc(socialUrl(s[0],r[s[0]]))+'" target="_blank" rel="noopener" aria-label="'+s[0]+'" title="'+esc(r[s[0]])+'">'+s[1]+'</a>'; });
    return it.length ? '<div class="ank__socs">'+it.join("")+'</div>' : ''; }
  function metaLine(r){ var p=[];
    if(r.age) p.push(esc(r.age)+' '+esc(tr().years));
    if(r.gender) p.push(esc(genderLabel(r.gender)));
    if(r.region) p.push(esc(r.region));
    if(r.citizenship) p.push(esc(r.citizenship));
    if(r.lang) p.push(esc(String(r.lang).toUpperCase()));
    return p.length?'<div class="ank__meta">'+p.map(function(z){return '<span>'+z+'</span>';}).join("")+'</div>':""; }
  function groupCells(r,g){
    // skip empty fields and the yes/no consent boxes ("Да/—") — they're noise here
    var fs=g.keys.filter(function(k){ return r[k]!=null && r[k]!=="" && !isBool(String(r[k])); });
    if(!fs.length) return "";
    return '<div class="ank__cell ank__cell--h">'+esc(tr().G[g.id]||g.id)+'</div>'+
      fs.map(function(k){ return '<div class="ank__cell"><span class="ank__fk">'+esc(L(k))+'</span><span class="ank__fv">'+dval(k,r[k])+'</span></div>'; }).join("");
  }

  function card(r,i){
    var id=esc(r.submissionId||""), x=tr();
    var photo=r.photo && String(r.photo).trim();
    var photoHtml=photo
      ? '<img src="'+esc(photo)+'" alt="" loading="lazy" referrerpolicy="no-referrer">'
      : '<span class="ank__photo-ph">'+ICN.user+'<span>'+esc(x.no_photo)+'</span></span>';
    var lines=[];
    if(r.phone) lines.push('<a class="ank__ci" href="tel:'+esc(String(r.phone).replace(/\s/g,""))+'">'+ICN.phone+'<span>'+esc(r.phone)+'</span></a>');
    if(r.email) lines.push('<a class="ank__ci" href="mailto:'+esc(r.email)+'">'+ICN.mail+'<span>'+esc(r.email)+'</span></a>');
    var socHtml=socsIcons(r);
    var contactHtml=(lines.length||socHtml) ? '<div class="ank__contact">'+(lines.length?'<div class="ank__lines">'+lines.join("")+'</div>':'')+socHtml+'</div>' : '';
    var hist=(r.history && String(r.history).trim())
      ? '<div class="ank__hist"><h4>'+esc(x.hist_h)+'</h4><p>'+esc(r.history)+'</p></div>' : '';
    var delay=Math.min(i*0.04,0.4);
    return ''+
      '<article class="anketa'+(r.reviewed?' is-reviewed':'')+'" data-id="'+id+'" data-status="'+esc(r.status||"")+'" style="animation-delay:'+delay+'s">'+
        '<div class="ank__head">'+
          '<div class="ank__photo">'+photoHtml+'</div>'+
          '<div class="ank__ident">'+
            '<h3 class="ank__name">'+esc(r.fullname||"—")+'</h3>'+
            metaLine(r)+
            contactHtml+
          '</div>'+
          '<div class="ank__head-end"><span class="ank__date">'+esc(fmtDate(r.submittedAt))+'</span><span class="ank__dot" aria-hidden="true"></span></div>'+
        '</div>'+
        hist+
        '<div class="ank__reveal"><div class="ank__reveal-in"></div></div>'+
        '<div class="ank__foot">'+
          '<button class="rvbtn ank__toggle" data-act="toggle" type="button">'+ICN.chevron+'<span>'+esc(x.expand)+'</span></button>'+
          '<button class="rvbtn" data-act="review" type="button">'+ICN.note+'<span>'+esc(x.review)+'</span></button>'+
          '<button class="prbtn" data-act="print" type="button">'+ICN.print+'<span>'+esc(x.print)+'</span></button>'+
        '</div>'+
      '</article>';
  }
  function buildDetails(r){
    var cells=GROUPS.filter(function(g){return g.id!=="contacts";}).map(function(g){return groupCells(r,g);}).join("");
    return '<div class="ank__body"><div class="ank__grid">'+cells+'</div></div>';
  }

  $("content").addEventListener("click", function(e){
    var btn=e.target.closest("button"); if(!btn) return;
    var cardEl=e.target.closest(".anketa"); if(!cardEl) return;
    var id=cardEl.getAttribute("data-id");
    if(btn.dataset.act==="toggle"){
      var rv=cardEl.querySelector(".ank__reveal"), inr=rv.querySelector(".ank__reveal-in"), lbl=btn.querySelector("span");
      if(rv.classList.contains("open")){
        rv.classList.remove("open"); btn.classList.remove("is-open"); lbl.textContent=tr().expand;
      } else {
        if(!inr.getAttribute("data-built")){ inr.innerHTML=buildDetails(rowById(id)); inr.setAttribute("data-built","1"); }
        void rv.offsetHeight;                 // register the 0fr start so it animates (rAF is throttled when hidden)
        rv.classList.add("open");
        btn.classList.add("is-open"); lbl.textContent=tr().collapse;
      }
    }
    else if(btn.dataset.act==="review"){ openReview(id); }
    else if(btn.dataset.act==="print"){ printAnketa(id); }
  });

  /* ---- print one anketa, clean sheet with the UPOP logo ---- */
  var PRINT_CSS = "@page{size:A4;margin:15mm}*{box-sizing:border-box}"+
    "body{font-family:'Manrope',system-ui,sans-serif;color:#1a1a1a;margin:0;background:#e8e5dc;padding:30px 16px;-webkit-print-color-adjust:exact;print-color-adjust:exact}"+
    ".sheet{width:100%;max-width:794px;margin:0 auto;background:#fff;border-radius:6px;padding:46px 52px;box-shadow:0 8px 34px rgba(0,0,0,.15)}"+
    ".ph{text-align:center;border-bottom:3px solid #D3A63F;padding-bottom:18px;margin-bottom:24px}"+
    ".ph img{height:88px;width:auto;display:block;margin:0 auto 12px}"+
    ".ph .t{font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0}"+
    ".ph .s{color:#7a6a45;font-size:16px;margin:7px 0 0}.ph .id{color:#9a9a9a;font-size:13px;margin:10px 0 0}"+
    ".top{text-align:center;margin-bottom:26px}"+
    ".top .photo{width:160px;height:200px;object-fit:cover;border:1px solid #ddd;border-radius:12px;display:block;margin:0 auto 14px;background:#f2f2f2}"+
    ".top .nm{font-family:'Manrope',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em;margin:0 0 10px}"+
    ".top .mt{color:#3f3f3f;font-size:16.5px;margin:0 0 5px}"+
    ".sec{break-inside:avoid;margin:0 0 20px}.sec h3{font-family:'Manrope',sans-serif;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.04em;color:#8A5F1C;border-bottom:1.5px solid #eadfca;padding-bottom:8px;margin:0 0 12px}"+
    ".fs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #e7ddc9;border-left:1px solid #e7ddc9;border-radius:8px;overflow:hidden}"+
    ".f{border-right:1px solid #e7ddc9;border-bottom:1px solid #e7ddc9;padding:13px 16px;font-size:16.5px;line-height:1.5}.f b{display:block;color:#877a5c;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}"+
    ".hist{white-space:pre-wrap;font-size:16.5px;line-height:1.6}"+
    ".ft{margin-top:28px;border-top:1px solid #eee;padding-top:12px;color:#aaa;font-size:11.5px;text-align:center}"+
    "@media print{body{background:#fff;padding:0}.sheet{max-width:none;margin:0;padding:0;box-shadow:none;border-radius:0}}";

  function printVal(k,v){ if(v==null||v==="") return "—"; if(isBool(v)) return v==="Ha"?tr().yes:"—"; return String(v); }
  function socsPlain(r){ return [["instagram","Instagram"],["tiktok","TikTok"],["telegram","Telegram"],["youtube","YouTube"]]
    .filter(function(s){return r[s[0]];}).map(function(s){ return s[1]+": "+r[s[0]]; }).join("  ·  "); }

  function printAnketa(id){
    var r=rowById(id); if(!r) return; var x=tr();
    var logo=location.origin+"/logo-hero.png";
    var photo=r.photo && String(r.photo).trim();
    var photoTag=photo?'<img class="photo" src="'+esc(photo)+'" referrerpolicy="no-referrer">':'<div class="photo"></div>';
    var secs=GROUPS.map(function(g){
      var fs=g.keys.filter(function(k){ return r[k]!=null && r[k]!=="" && !isBool(String(r[k])); }).map(function(k){
        return '<div class="f"><b>'+esc(L(k))+'</b>'+esc(printVal(k,r[k]))+'</div>'; });
      if(g.id==="contacts"){ var s=socsPlain(r); if(s) fs.push('<div class="f"><b>'+esc(x.socials)+'</b>'+esc(s)+'</div>'); }
      return fs.length?'<section class="sec"><h3>'+esc(x.G[g.id]||g.id)+'</h3><div class="fs">'+fs.join("")+'</div></section>':"";
    }).join("");
    var hist=(r.history && String(r.history).trim())?'<section class="sec"><h3>'+esc(x.hist_h)+'</h3><div class="hist">'+esc(r.history)+'</div></section>':"";
    var meta=[ (r.age?r.age+" "+x.years:""), genderLabel(r.gender), r.region, r.citizenship, (r.lang?String(r.lang).toUpperCase():"") ].filter(Boolean).join(" · ");
    var contact=[ r.phone, r.email ].filter(Boolean).join("   ·   ");
    var html='<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>'+esc(x.anketa_title)+' — '+esc(r.fullname||"")+'</title>'+
      '<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">'+
      '<style>'+PRINT_CSS+'</style></head><body><div class="sheet">'+
      '<div class="ph"><img src="'+logo+'"><p class="t">U POP TREND</p><p class="s">'+esc(x.anketa_title)+' · '+esc(x.print_sub)+'</p><p class="id">'+esc(fmtDate(r.submittedAt))+' · '+esc(r.submissionId||"")+'</p></div>'+
      '<div class="top">'+photoTag+'<div class="nm">'+esc(r.fullname||"—")+'</div>'+
        (meta?'<p class="mt">'+esc(meta)+'</p>':'')+(contact?'<p class="mt">'+esc(contact)+'</p>':'')+'</div>'+
      secs+hist+
      '<div class="ft">Designed &amp; Developed by teiior · U POP TREND</div></div>'+
      '<scr'+'ipt>window.onload=function(){setTimeout(function(){window.focus();window.print();},400);};<\/scr'+'ipt>'+
      '</body></html>';
    var w=window.open("","_blank"); if(!w){ alert(tr().savefail); return; }
    w.document.open(); w.document.write(html); w.document.close();
  }

  /* ---- review dialog: photo + history + colour saved together ---- */
  function autogrow(ta){ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight+2, Math.round(window.innerHeight*0.42))+"px"; }
  function setSwatch(s){ rev.status=s||""; $("revSwatches").querySelectorAll(".sw").forEach(function(b){ b.classList.toggle("is-on",(b.getAttribute("data-s")||"")===rev.status); });
    $("revSwatches").querySelectorAll(".sw[data-s]").forEach(function(b){ if(b.getAttribute("data-s")) b.innerHTML=ICN.check; }); }
  function setRevPhoto(url){ var img=$("revPhotoImg"), ph=$("revPhotoPh");
    if(url){ img.src=url; img.hidden=false; ph.innerHTML=""; } else { img.hidden=true; img.removeAttribute("src"); ph.innerHTML=ICN.user; } }
  function openReview(id){
    var row=rowById(id); if(!row) return; rev.id=id; rev.photo=null;
    $("revName").textContent=row.fullname||"—";
    $("revSub").textContent=[row.phone,row.region].filter(Boolean).join(" · ");
    var ta=$("revTa"); ta.value=row.history||""; $("revErr").textContent="";
    setSwatch(row.status||"");
    setRevPhoto(row.photo && String(row.photo).trim() ? row.photo : "");
    $("revPhotoBtn").textContent=(row.photo && String(row.photo).trim())?tr().photo_replace:tr().photo_add;
    $("revPhotoInput").value="";
    var dlg=$("rev"); if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
    requestAnimationFrame(function(){ autogrow(ta); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); });
  }
  function closeReview(){ var dlg=$("rev"); if(dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
  $("revTa").addEventListener("input", function(){ autogrow(this); });
  $("revSwatches").addEventListener("click", function(e){ var b=e.target.closest(".sw"); if(!b) return; e.preventDefault(); setSwatch(b.getAttribute("data-s")||""); });
  $("revPhotoInput").addEventListener("change", function(){
    var f=this.files && this.files[0]; if(!f) return;
    compressImage(f, 1000, 0.82).then(function(url){ rev.photo=url; setRevPhoto(url); $("revPhotoBtn").textContent=tr().photo_replace; }).catch(function(){});
  });
  $("revX").addEventListener("click", closeReview);
  $("revCancel").addEventListener("click", closeReview);
  $("rev").addEventListener("click", function(e){ if(e.target===this) closeReview(); });
  $("revSave").addEventListener("click", function(){
    var id=rev.id; if(!id) return;
    var hist=$("revTa").value, status=rev.status||"";
    var btn=$("revSave"), lbl=btn.querySelector(".rvlbl"), old=lbl.textContent;
    btn.disabled=true; lbl.textContent=tr().saving; $("revErr").textContent="";
    var payload={ action:"review", key:state.key, submissionId:id, status:status, history:hist };
    if(rev.photo){ payload.photo=rev.photo; payload.photoType="image/jpeg"; }
    api(payload).then(function(res){
      if(!res||res.ok!==true) throw new Error((res&&res.error)||"error");
      var row=rowById(id);
      if(row){ row.status=res.status||""; row.history=(res.history!=null?res.history:hist); row.reviewed=row.status!=="";
        if(res.photo) row.photo=res.photo; }
      btn.disabled=false; lbl.textContent=old;
      closeReview(); buildFilters(); render(false);
    }).catch(function(){ btn.disabled=false; lbl.textContent=old; $("revErr").textContent=tr().savefail; });
  });

  /* ---- boot ---- */
  applyTheme(); applyLang();
  (function(){
    var key=null; try{ key=sessionStorage.getItem(KEY_STORE); }catch(e){}
    if(!key) return;
    $("login").hidden=true;
    document.body.insertAdjacentHTML("afterbegin",'<div class="state" id="boot"><div class="spin"></div>'+esc(tr().loading)+'</div>');
    loadList(key).then(function(){ var b=$("boot"); if(b) b.remove(); showApp(); })
      .catch(function(){ var b=$("boot"); if(b) b.remove(); $("login").hidden=false; });
  })();
</script>
</body>
</html>
